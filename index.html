    function wrapMermaidLabel(str = '', lineLen = 20) {
      const clean = String(str)
        .replace(/\*\*/g, '')
        .replace(/"/g, "'")
        .replace(/[[\]()]/g, ' ')
        .trim();
      const chunks = [];
      for (let i = 0; i < clean.length; i += lineLen) {
        chunks.push(clean.slice(i, i + lineLen));
      }
      return chunks.join('<br/>');
    }

    function FormattedStoryBlock({ story, fontSizeLevel = 'large', boldHighlight = true }) {
      if (!story) return null;

      const sizeClassMap = {
        medium: 'text-base leading-relaxed',
        large: 'text-lg leading-loose',
        xlarge: 'text-xl leading-loose'
      };

      const paragraphs = String(story).split(/\n+/);

      const renderInlineBold = (text, pIdx) => {
        const parts = text.split(/(\*\*.*?\*\*)/g);
        return parts.map((part, idx) => {
          if (part.startsWith('**') && part.endsWith('**')) {
            const inner = part.slice(2, -2);
            return (
              <strong
                key={`${pIdx}-${idx}`}
                className={
                  boldHighlight
                    ? 'font-extrabold text-slate-950 bg-amber-200/80 px-1.5 py-0.5 rounded-md border-b-2 border-amber-500 shadow-2xs'
                    : 'font-extrabold text-slate-950 underline decoration-indigo-500 decoration-2 underline-offset-4'
                }
              >
                {inner}
              </strong>
            );
          }
          return <span key={`${pIdx}-${idx}`}>{part}</span>;
        });
      };

      return (
        <div className={`space-y-4 text-slate-800 ${sizeClassMap[fontSizeLevel] || sizeClassMap.large}`}>
          {paragraphs.map((para, pIdx) => {
            const isHeaderLine = para.trim().startsWith('【') && para.trim().endsWith('】');
            if (isHeaderLine) {
              return (
                <div
                  key={pIdx}
                  className="text-lg sm:text-xl font-extrabold text-indigo-950 bg-indigo-100/80 border-l-4 border-indigo-600 px-4 py-2.5 rounded-r-xl tracking-tight"
                >
                  {para}
                </div>
              );
            }
            return (
              <p key={pIdx} className="tracking-normal">
                {renderInlineBold(para, pIdx)}
              </p>
            );
          })}
        </div>
      );
    }

    let mermaidInitialized = false;
    function ensureMermaidReady() {
      if (typeof window !== 'undefined' && window.mermaid) {
        if (!mermaidInitialized) {
          window.mermaid.initialize({
            startOnLoad: false,
            theme: 'base',
            securityLevel: 'loose',
            fontFamily: '"Noto Sans TC", system-ui, -apple-system, sans-serif',
            flowchart: {
              htmlLabels: true,
              curve: 'basis',
              padding: 16,
              nodeSpacing: 45,
              rankSpacing: 55
            },
            themeVariables: {
              fontSize: '18px'
            }
          });
          mermaidInitialized = true;
        }
        return Promise.resolve(window.mermaid);
      }
      return Promise.reject(new Error('Mermaid 尚未就緒'));
    }

    function MermaidDiagramCard({
      scenario,
      onSaveMermaidCode,
      onRegenerateMermaidWithAI,
      isGeneratingMermaid = false,
      externalFullscreenTrigger = 0
    }) {
      const [svgContent, setSvgContent] = useState('');
      const [renderError, setRenderError] = useState('');
      const [isEditingCode, setIsEditingCode] = useState(false);
      const [draftCode, setDraftCode] = useState(scenario?.mermaidCode || '');
      const [isExportingPng, setIsExportingPng] = useState(false);
      const [isFullscreenModalOpen, setIsFullscreenModalOpen] = useState(false);
      const [modalZoomScale, setModalZoomScale] = useState(1.6);

      useEffect(() => {
        if (externalFullscreenTrigger > 0) {
          setIsFullscreenModalOpen(true);
        }
      }, [externalFullscreenTrigger]);

      const fallbackMermaid = useMemo(() => {
        if (!scenario) return '';
        return buildPreciseMermaidFromScenario({
          title: scenario.title || '商業決策情境',
          phenom: scenario.facts?.[0] || scenario.topic || '推動轉型專案',
          metricA: scenario.facts?.[1] || '初期效率指標提升',
          metricB: scenario.facts?.[2] || '終端滿意度與留存下滑',
          conflict: scenario.facts?.[3] || '第一線執行與舊有考核制度衝突',
          unk1: scenario.unknowns?.[0] || '表面數據中有多少屬於假性達標？'
        });
      }, [scenario]);

      const activeMermaidCode = scenario?.mermaidCode || fallbackMermaid;

      useEffect(() => {
        setDraftCode(activeMermaidCode);
      }, [activeMermaidCode, scenario?.id]);

      useEffect(() => {
        let isMounted = true;
        const renderDiagram = async () => {
          if (!activeMermaidCode) return;
          setRenderError('');
          try {
            const mermaid = await ensureMermaidReady();
            const uniqueId = `mermaid-svg-${scenario?.id || 'temp'}-${Date.now()}`;
            const { svg } = await mermaid.render(uniqueId, activeMermaidCode);
            if (isMounted) {
              setSvgContent(svg);
            }
          } catch (err) {
            if (isMounted) {
              setRenderError('Mermaid 語法解析失敗，請點擊「編輯語法」檢查括號或節點格式。');
            }
          }
        };
        renderDiagram();
        return () => {
          isMounted = false;
        };
      }, [activeMermaidCode, scenario?.id]);

      const handleDownloadSvg = () => {
        if (!svgContent) return;
        const blob = new Blob([svgContent], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `${scenario?.id || 'scenario'}_角色利害關係圖.svg`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
      };

      const handleDownloadPng = () => {
        if (!svgContent) return;
        setIsExportingPng(true);
        try {
          const parser = new DOMParser();
          const svgDoc = parser.parseFromString(svgContent, 'image/svg+xml');
          const svgEl = svgDoc.querySelector('svg');
          if (!svgEl) {
            setIsExportingPng(false);
            return;
          }

          let width = 1200;
          let height = 800;
          const viewBox = svgEl.getAttribute('viewBox');
          if (viewBox) {
            const parts = viewBox.split(/[\s,]+/).map(Number);
            if (parts.length === 4 && parts[2] > 0 && parts[3] > 0) {
              width = parts[2];
              height = parts[3];
            }
          }

          const scaleFactor = 2;
          const padding = 48;
          const canvasWidth = Math.max(Math.round(width * scaleFactor) + padding * 2, 1400);
          const canvasHeight = Math.max(Math.round(height * scaleFactor) + padding * 2 + 60, 900);

          svgEl.setAttribute('width', `${Math.round(width * scaleFactor)}`);
          svgEl.setAttribute('height', `${Math.round(height * scaleFactor)}`);
          if (!svgEl.getAttribute('xmlns')) {
            svgEl.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
          }

          const serializedSvg = new XMLSerializer().serializeToString(svgEl);
          const svgBase64 =
            'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(serializedSvg)));

          const img = new Image();
          img.crossOrigin = 'anonymous';
          img.onload = () => {
            const canvas = document.createElement('canvas');
            canvas.width = canvasWidth;
            canvas.height = canvasHeight;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvasWidth, canvasHeight);

            ctx.fillStyle = '#1e1b4b';
            ctx.font = 'bold 28px "Noto Sans TC", system-ui, sans-serif';
            ctx.fillText(
              `【角色利害關係與關鍵數據衝突圖】${scenario?.title || ''}`,
              padding,
              padding + 16
            );

            const drawX = Math.max(padding, Math.round((canvasWidth - img.width) / 2));
            const drawY = padding + 45;
            ctx.drawImage(img, drawX, drawY);

            canvas.toBlob((pngBlob) => {
              if (pngBlob) {
                const pngUrl = URL.createObjectURL(pngBlob);
                const a = document.createElement('a');
                a.href = pngUrl;
                a.download = `${scenario?.id || 'scenario'}_${scenario?.title || '角色利害關係圖'}.png`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(pngUrl);
              }
              setIsExportingPng(false);
            }, 'image/png');
          };
          img.onerror = () => setIsExportingPng(false);
          img.src = svgBase64;
        } catch (e) {
          setIsExportingPng(false);
        }
      };

      return (
        <div className="bg-white rounded-2xl border-2 border-indigo-200 shadow-xs overflow-hidden">
          <div className="bg-gradient-to-r from-indigo-950 via-indigo-900 to-slate-900 px-4 py-3 text-white flex flex-wrap items-center justify-between gap-2">
            <div className="flex items-center gap-2">
              <GitBranch className="w-5 h-5 text-amber-400 shrink-0" />
              <div>
                <h3 className="text-sm sm:text-base font-extrabold tracking-tight flex items-center gap-2">
                  <span>角色利害關係與關鍵數據衝突圖</span>
                  <span className="text-[11px] bg-amber-400 text-slate-950 px-2 py-0.5 rounded-full font-black">
                    100% 數據對齊
                  </span>
                </h3>
              </div>
            </div>
            <div className="flex flex-wrap items-center gap-1.5">
              <button
                type="button"
                onClick={() => setIsFullscreenModalOpen(true)}
                className="inline-flex items-center gap-1 px-3 py-1.5 rounded-lg text-xs font-extrabold bg-amber-400 hover:bg-amber-300 text-slate-950 shadow-xs transition cursor-pointer"
              >
                <Maximize2 className="w-3.5 h-3.5" />
                <span>🔍 獨立放大檢視關係圖</span>
              </button>
              <button
                type="button"
                onClick={handleDownloadPng}
                disabled={isExportingPng || !svgContent}
                className="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-xs font-bold bg-indigo-600 hover:bg-indigo-500 text-white transition cursor-pointer disabled:opacity-50"
              >
                <ImageIcon className="w-3.5 h-3.5" />
                <span>{isExportingPng ? '轉檔中...' : '下載 PNG'}</span>
              </button>
              <button
                type="button"
                onClick={handleDownloadSvg}
                disabled={!svgContent}
                className="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-xs font-bold bg-white/10 hover:bg-white/20 text-white transition cursor-pointer"
              >
                <Download className="w-3.5 h-3.5" />
                <span>SVG</span>
              </button>
              {onRegenerateMermaidWithAI && (
                <button
                  type="button"
                  onClick={onRegenerateMermaidWithAI}

    // ============================================================================

    function App() {

      const [classrooms, setClassrooms] = useState(() => {
        try {

              const map = new Map();
              INITIAL_CLASSROOMS.forEach((c) => map.set(c.joinCode.toUpperCase(), c));
              parsed.forEach((c) => {
                if (c && c.joinCode) map.set(c.joinCode.toUpperCase(), c);
              });

            }
          }
        } catch (e) {}
        return INITIAL_CLASSROOMS;
      });
      const [activeClassId, setActiveClassId] = useState(() => {
        try {

        }
      });
      const [sessions, setSessions] = useState(() => {
        try {
          const saved = localStorage.getItem('tony_lab_sessions_v1');
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length > 0) {
              const map = new Map();
              INITIAL_SESSIONS.forEach((s) => map.set(s.id, s));
              parsed.forEach((s) => {
                if (s && s.id) map.set(s.id, s);
              });
              return Array.from(map.values());
            }
          }
        } catch (e) {}
        return INITIAL_SESSIONS;
      });
      const [activeSessionId, setActiveSessionId] = useState('SES-1001');
      const [cloudSyncStatus, setCloudSyncStatus] = useState('checking'); // 'checking' | 'connected' | 'permission_denied'
      const [showFirestoreRulesModal, setShowFirestoreRulesModal] = useState(false);

      // 加入碼與課堂 QR Code / 大螢幕答案牆狀態
      const [joinCodeInput, setJoinCodeInput] = useState('TONY26');
      const [studentNameInput, setStudentNameInput] = useState('');
      const [isQrStudentMode, setIsQrStudentMode] = useState(false);
      const [qrStudentCheckedIn, setQrStudentCheckedIn] = useState(false);
      const [qrMobileDrawer, setQrMobileDrawer] = useState('none'); // 'none' | 'story' | 'hint'
      const [isQrPosterOpen, setIsQrPosterOpen] = useState(false);
      const [isLiveWallOpen, setIsLiveWallOpen] = useState(false);
      const [liveWallStageFilter, setLiveWallStageFilter] = useState('ALL');
      const [liveWallAnonymous, setLiveWallAnonymous] = useState(true);
      const [spotlightCard, setSpotlightCard] = useState(null);

      const [selectedStageId, setSelectedStageId] = useState('G0');
      const [draftResponse, setDraftResponse] = useState('');
      const [currentAssistance, setCurrentAssistance] = useState('self');
      const [showHintBox, setShowHintBox] = useState(false);
      const [showDemoBox, setShowDemoBox] = useState(false);
      const [diagramFullscreenTrigger, setDiagramFullscreenTrigger] = useState(0);

      const [apiKeyInput, setApiKeyInput] = useState('');
      const [byokScope, setByokScope] = useState('class_shared');
      const [byokState, setByokState] = useState({
        verified: false,
        sessionId: null,
        expiresAt: null,
        scope: 'class_shared',
        inMemoryKey: ''
      });

      const [newClassTitle, setNewClassTitle] = useState('');
      const [newClassScenarioId, setNewClassScenarioId] = useState('SC01');
      const [newClassAllowDemo, setNewClassAllowDemo] = useState(true);
      const [genTopicInput, setGenTopicInput] = useState('');
      const [genAudienceInput, setGenAudienceInput] = useState('企業中高階主管與跨部門專案負責人');
      const [isGeneratingScenario, setIsGeneratingScenario] = useState(false);
      const [isGeneratingMermaid, setIsGeneratingMermaid] = useState(false);

      const [toast, setToast] = useState(null);
      const showToast = (msg, type = 'info') => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 4000);
      };
      const [isSubmittingCloud, setIsSubmittingCloud] = useState(false);
      const [lastCloudDeliveredAt, setLastCloudDeliveredAt] = useState('');

      // 確保手機掃碼免註冊學員也具備 Firebase Auth 憑證（防止預設 Firestore Rules 阻擋未登入手機寫入）
      const ensureQrStudentCloudAuth = async () => {
        if (auth.currentUser) return auth.currentUser;
        try {
          const anonCred = await signInAnonymously(auth);
          return anonCred.user;
        } catch (e1) {
          const syncEmail = 'live_student_sync@tonythinkinglab.com';
          const syncPass = 'TonyThinkingLab2026!';
          try {
            const loginCred = await signInWithEmailAndPassword(auth, syncEmail, syncPass);
            return loginCred.user;
          } catch (e2) {
            try {
              const regCred = await createUserWithEmailAndPassword(auth, syncEmail, syncPass);
              return regCred.user;
            } catch (e3) {
              return null;
            }
          }
        }
      };

      // 手動強制從雲端拉取最新全班作答（供老師大螢幕隨時點擊刷新）
      const handleManualPullCloudSessions = async () => {
        try {
          const snap = await getDocs(collection(db, 'sessions'));
          if (!snap.empty) {
            const cloudSessions = snap.docs.map((d) => d.data());
            setSessions((prev) => {
              const map = new Map();
              prev.forEach((s) => map.set(s.id, s));
              cloudSessions.forEach((s) => {
                if (s && s.id) map.set(s.id, s);
              });
              return Array.from(map.values());
            });
          }
          showToast('🔄 已從雲端同步全班最新作答紀錄！', 'success');
        } catch (err) {
          showToast('雲端同步提醒：請確認網路連線或 Firestore Rules 設定', 'error');
        }
      };

      // 0.9 本地永久儲存同步（確保重新整理瀏覽器後，已建立的課程、客製化情境、學員表現 100% 不遺失）
      useEffect(() => {
        try {
          localStorage.setItem('tony_lab_classrooms_v1', JSON.stringify(classrooms));
        } catch (e) {}
      }, [classrooms]);

      useEffect(() => {
        try {
          localStorage.setItem('tony_lab_active_class_id_v1', activeClassId);
        } catch (e) {}
      }, [activeClassId]);

      useEffect(() => {
        try {
          localStorage.setItem('tony_lab_scenarios_v1', JSON.stringify(scenarios));
        } catch (e) {}
      }, [scenarios]);

      useEffect(() => {
        try {
          localStorage.setItem('tony_lab_sessions_v1', JSON.stringify(sessions));
        } catch (e) {}
      }, [sessions]);

      // 1. 監聽 Firestore classrooms、scenarios 與 sessions 集合，實現「老師電腦 × 學員手機」跨裝置即時同步並偵測 Rules 權限
      useEffect(() => {
        let unsubClassrooms = null;
        let unsubSessions = null;
        let unsubScenarios = null;
        try {
          unsubClassrooms = onSnapshot(
            collection(db, 'classrooms'),
            (snap) => {
              setCloudSyncStatus('connected');
              if (!snap.empty) {
                const cloudClasses = snap.docs.map((d) => d.data());
                setClassrooms((prev) => {
                  const map = new Map();
                  prev.forEach((c) => map.set(c.joinCode.toUpperCase(), c));
                  cloudClasses.forEach((c) => {
                    if (c && c.joinCode) {
                      map.set(c.joinCode.toUpperCase(), c);
                    }
                  });
                  return Array.from(map.values());
                });
              }
            },
            (err) => {
              if (err && (err.code === 'permission-denied' || String(err).includes('permission'))) {
                setCloudSyncStatus('permission_denied');
              }
            }
          );

          unsubScenarios = onSnapshot(
            collection(db, 'scenarios'),
            (snap) => {
              if (!snap.empty) {
                const cloudScenarios = snap.docs.map((d) => d.data());
                setScenarios((prev) => {
                  const map = new Map();
                  prev.forEach((s) => map.set(s.id, s));
                  cloudScenarios.forEach((s) => {
                    if (s && s.id) {
                      map.set(s.id, s);
                    }
                  });
                  return Array.from(map.values());
                });
              }
            },
            () => {}
          );

          unsubSessions = onSnapshot(
            collection(db, 'sessions'),
            (snap) => {
              if (!snap.empty) {
                const cloudSessions = snap.docs.map((d) => d.data());
                setSessions((prev) => {
                  const map = new Map();
                  prev.forEach((s) => map.set(s.id, s));
                  cloudSessions.forEach((s) => {
                    if (s && s.id) {
                      map.set(s.id, s);
                    }
                  });
                  return Array.from(map.values());
                });
              }
            },
            () => {}
          );
        } catch (err) {
          // ignore
        }
        return () => {
          if (unsubClassrooms) unsubClassrooms();
          if (unsubScenarios) unsubScenarios();
          if (unsubSessions) unsubSessions();
        };
      }, []);

      // 2. 手機掃描 QR Code 進入時，自動啟動「📱 學員掃碼專屬極簡互動模式 (isQrStudentMode)」並綁定老師課堂
      useEffect(() => {
        if (typeof window !== 'undefined') {
          const params = new URLSearchParams(window.location.search);
          const joinParam = params.get('join');
          const titleParam = params.get('title');
          const scParam = params.get('sc');
          const scTitleParam = params.get('sctitle');
          const scIndParam = params.get('scind');
          const demoParam = params.get('demo');
          const stageParam = params.get('stage');

          if (joinParam) {
            const cleanCode = joinParam.trim().toUpperCase();
            setJoinCodeInput(cleanCode);
            setRole('student');
            setIsQrStudentMode(true);

            // 若老師指派的是客製化情境 (例如 SC51)，且學員手機尚未從 Firestore 載入完成，先用網址參數建立基底情境確保手機立即可讀
            if (scParam && scTitleParam) {
              setScenarios((prev) => {
                if (prev.some((s) => s.id === scParam)) return prev;
                const fallbackCustomSc = buildScenarioItem(
                  scParam,
                  'IND01',
                  scIndParam || '企業客製化實戰情境',
                  scTitleParam,
                  `${scTitleParam} 決策與指標背離分析`,
                  `推動「${scTitleParam}」轉型與自動化機制`,
                  '首季帳面效率提升 **42%**，單位作業成本下降 **28%**',
                  '終端高價值客戶淨推薦值 (**NPS**) 下滑 **16 點**，第一線人員反彈增加 **1.8 倍**',
                  '第一線團隊承受雙倍複雜度個案，卻仍受限於舊制「**單日件數 KPI**」考核',
                  '表面 42% 效率提升中，有多少比例屬於假性結案或風險遞延？',
                  '高價值客戶流失是否集中在特定高複雜度服務場景？',
                  '若同步調整第一線人員加權考核指標，成本與留存率的平衡點為何？'
                );
                return [{ ...fallbackCustomSc, isCustom: true }, ...prev];
              });
            }

            const targetId = `CLS-${cleanCode}`;
            setClassrooms((prev) => {
              const existing = prev.find((c) => c.joinCode.toUpperCase() === cleanCode);
              if (existing) {
                setActiveClassId(existing.id);
                return prev.map((c) =>
                  c.joinCode.toUpperCase() === cleanCode
                    ? {
                        ...c,
                        title: titleParam || c.title,
                        scenarioId: scParam || c.scenarioId,
                        activeBroadcastStage: stageParam || c.activeBroadcastStage || 'G0'
                      }
                    : c
                );
              }
              const qrInjectedClass = {
                id: targetId,
                teacherId: 'teacher-1',
                title: titleParam || `課堂實戰演練 (${cleanCode})`,
                joinCode: cleanCode,
                joinExpiresAt: '2026-12-31 23:59',
                status: 'active',
                scenarioId: scParam || 'SC02',
                allowAiDemo: demoParam !== '0',
                pacingMode: 'teacher_sync',
                activeBroadcastStage: stageParam || 'G0',
                tokenBudget: 120000,
                tokensUsed: 0,
                studentCount: 1
              };
              setActiveClassId(targetId);
              return [qrInjectedClass, ...prev];
            });

            if (stageParam) {
              setSelectedStageId(stageParam);
            }
          }
        }
      }, []);

      useEffect(() => {
        const unsub = onAuthStateChanged(auth, async (fbUser) => {
          if (!fbUser) {
            if (!isQrStudentMode) {
              setCurrentUser(null);
            }
            return;
          }
          // 若為手機掃碼極簡模式的背景同步憑證，不覆蓋學員現場輸入的姓名
          if (
            fbUser.isAnonymous ||
            (fbUser.email || '').toLowerCase() === 'live_student_sync@tonythinkinglab.com'
          ) {
            return;
          }
          const emailLower = (fbUser.email || '').toLowerCase();
          const isCreator = emailLower === CREATOR_ADMIN_EMAIL;
          const isGoogle = fbUser.providerData?.some((p) => p.providerId === 'google.com');

          if (!fbUser.emailVerified && !isGoogle && !isCreator) {
            setUnverifiedUserObj(fbUser);
            setCurrentUser(null);
            return;
          }

          const assignedRole = isCreator ? 'admin' : 'user';
          const userObj = {
            uid: fbUser.uid,
            email: fbUser.email,
            realName: fbUser.displayName || (isCreator ? 'TONY 楊文澤老師' : fbUser.email?.split('@')[0]),
            role: assignedRole,
            isSystemCreator: isCreator,
            memberIdentity: isCreator ? 'TONY老師學員' : authIdentity
          };

                          {m.example}

                <div className="bg-gradient-to-r from-amber-50 via-orange-50 to-amber-50 rounded-3xl p-6 border-2 border-amber-300 shadow-xs space-y-3">

                      onClick={() => {

                        setDraftResponse((prev) =>

                            ? `${prev}\n\n${currentItem.formulaTemplate}`
                            : currentItem.formulaTemplate

                        if (currentAssistance === 'self') {
                          setCurrentAssistance('hint');

                        setIsKnowledgeCodexOpen(false);
                        setActiveView('learn');

                          'success'

                </button>

          stage: activeClassroom.activeBroadcastStage || 'G0'

            >
              <button
                type="button"
                onClick={() => setIsQrPosterOpen(false)}
                className="absolute top-5 right-5 px-4 py-2 rounded-xl bg-white/10 hover:bg-white/20 text-sm font-extrabold flex items-center gap-1.5 cursor-pointer"
              >
                <X className="w-4 h-4" /> 關閉海報
              </button>

              <div className="grid grid-cols-1 md:grid-cols-12 gap-8 items-center">
                <div className="md:col-span-7 space-y-5">
                  <div className="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-amber-400 text-slate-950 text-xs font-black">
                    <Smartphone className="w-4 h-4" /> 手機掃碼立即進入課堂思考任務
                  </div>
                  <h2 className="text-2xl sm:text-4xl font-black tracking-tight leading-tight">
                    {activeClassroom.title}
                  </h2>
                  <p className="text-indigo-200 text-base sm:text-lg font-medium">

                    <div className="text-xs uppercase tracking-wider text-indigo-200 font-bold">
                      課堂 6 碼加入碼 (Join Code)

                    <div className="text-4xl sm:text-5xl font-black tracking-widest text-amber-400 font-mono">
                      {activeClassroom.joinCode}
                    </div>
                    <div className="text-xs text-slate-300 pt-1">
                      1. 手機相機掃描右側 QR Code ➔ 2. 自動帶入加入碼 ➔ 3. 開始 G0–G6 闖關並投遞到大螢幕！
                    </div>
                  </div>
                </div>

                <div className="md:col-span-5 flex flex-col items-center">
                  <div className="bg-white p-5 rounded-3xl shadow-2xl border-4 border-amber-400">

                      alt="Classroom Join QR Code"

                    請拿出手機開啟相機掃描上方 QR Code

      const handleSimulateStudentSubmission = () => {

        const pickName = sampleNames[Math.floor(Math.random() * sampleNames.length)];
        const pickStage =
          liveWallStageFilter !== 'ALL'
            ? liveWallStageFilter
            : activeClassroom?.activeBroadcastStage ||
              sampleStages[Math.floor(Math.random() * sampleStages.length)];

        const sampleAnswers = {
          G0: '我觀察到帳面自動結案率 82% 很漂亮，但關鍵未知是其中到底有多少比例是客戶被 AI 鬼打牆後直接放棄關掉視窗？在沒查清前不能全面擴編。',
          G1: '管理層預設了「回應由 4 分鐘降為 3 秒就等於服務變好」的假設，但忽略了 VIP 真正在意的是複雜退換貨能不能一次解決。',
          G2: '視角一（IT 成本視角）：省下 95 萬人事費達標；視角二（第一線專員考核視角）：留任 12 人全接最難的炸彈客，卻還用每小時結案數考核，必然導致草率結案。',
          G3: '使用 5 Whys 拆解：為何 VIP 續購掉 6.5%？因為高單價問題沒被解決 ➔ 為何沒解決？因為專員不敢花超過 10 分鐘深究 ➔ 為何不敢？因為舊 KPI 懲罰長通話。',
          G4: '觸發情境：每次導入 AI 自動化減少人力時。具體行為：強制同步重設計真人專員的複雜案件加權 KPI。驗證方式：雙週追蹤轉真人後首次解決率 (FCR)。'
        };

        const newStuSession = {
          id: `SES-LIVE-${Date.now().toString().slice(-4)}`,
          classId: activeClassroom?.id || 'CLS-2026-A',
          assignmentId: 'ASG-01',
          scenarioId: activeScenario?.id || 'SC01',
          studentId: `stu-live-${Date.now()}`,
          studentName: pickName,
          currentStage: pickStage,
          status: 'in_progress',
          uiState: 'saved',
          startedAt: new Date().toTimeString().slice(0, 5),
          finishedAt: null,
          checkedFacts: [0, 1, 2],
          checkedUnknowns: [0],
          responses: {
            [pickStage]: {
              content: sampleAnswers[pickStage] || sampleAnswers.G2,
              revision: 1,
              assistanceLevel: 'self',
              submittedAt: new Date().toTimeString().slice(0, 5),
              passed: true
            }
          },
          feedback: {},
          assessment: {
            rubricVersion: 'rubric-1.0',
            modelId: 'gemini-2.5-flash',
            reviewStatus: 'pending_review',
            scores: { assumption: 2, perspective: 2, method: 2, evidence: 2, habit: 2, metacognition: 1 },
            evidence: [],
            actionPlan: '持續追蹤指標背離根因。'
          }
        };

        setSessions((prev) => [newStuSession, ...prev]);
        showToast(`📱 已收到手機端學員「${pickName}」投遞的 ${pickStage} 回答！`, 'success');
      };

      const renderLiveAnswerWallModal = () => {
        if (!isLiveWallOpen) return null;

        const currentBroadcastStage = activeClassroom?.activeBroadcastStage || 'G0';
        const currentBroadcastIdx = STAGES.findIndex((s) => s.id === currentBroadcastStage);
        const prevStageObj = STAGES[Math.max(0, currentBroadcastIdx - 1)];
        const nextStageObj = STAGES[Math.min(STAGES.length - 1, currentBroadcastIdx + 1)];
        const activeJoinCodeUpper = (activeClassroom?.joinCode || 'TONY26').toUpperCase();

        // 同時比對 joinCode、classId 與 sessionId，確保手機掃碼投遞的卡片 100% 顯示在老師大螢幕！
        const classSessionsForWall = sessions.filter((s) => {
          const sJoin = (s.joinCode || '').toUpperCase();
          return (
            (sJoin && sJoin === activeJoinCodeUpper) ||
            s.classId === activeClassroom?.id ||
            s.classId === `CLS-${activeJoinCodeUpper}` ||
            s.classId === `CLS-QR-${activeJoinCodeUpper}` ||
            s.id?.toUpperCase().includes(`-${activeJoinCodeUpper}-`)
          );
        });
        const sourceSessions =
          classSessionsForWall.length > 0 ? classSessionsForWall : sessions;

        // 計算各關卡目前已收到的投遞數量（顯示在關卡按鈕上，讓老師一眼看到哪一關有新答案）
        const stageCounts = {};
        STAGES.forEach((st) => {
          stageCounts[st.id] = 0;
        });
        sourceSessions.forEach((s) => {
          Object.keys(s.responses || {}).forEach((stg) => {
            if (s.responses[stg]?.content) {
              stageCounts[stg] = (stageCounts[stg] || 0) + 1;
            }
          });
        });

        const cards = [];
        sourceSessions.forEach((s, sIdx) => {
          Object.entries(s.responses || {}).forEach(([stg, respObj]) => {
            if (!respObj?.content) return;
            if (liveWallStageFilter !== 'ALL' && stg !== liveWallStageFilter) return;
            cards.push({
              id: `${s.id}-${stg}`,
              studentName: s.studentName,
              anonymousLabel: `學員 #${String(sIdx + 1).padStart(2, '0')}`,
              stage: stg,
              content: respObj.content,
              submittedAt: respObj.submittedAt,
              assistanceLevel: respObj.assistanceLevel,
              passed: respObj.passed
            });
          });
        });

        return (
          <div className="fixed inset-0 z-50 bg-slate-950 text-white flex flex-col">

                  type="button"

                    liveWallAnonymous
                      ? 'bg-amber-400 text-slate-950 border-amber-300'
                      : 'bg-slate-800 text-slate-200 border-slate-700'
                  }`}

                  {liveWallAnonymous ? (
                    <>
                      <EyeOff className="w-4 h-4" /> 🙈 匿名投影中（點擊切換實名）
                    </>

                    <>

                <button

                >
                  <QrCode className="w-4 h-4" /> 顯示 QR Code
                </button>

                <button

                        try {
                          const docRef = doc(db, 'classrooms', cleanCode);

                          if (snap.exists()) {

                <Radio
                  className={`w-5 h-5 shrink-0 ${
                    isTeacherSyncMode ? 'text-amber-400 animate-pulse' : 'text-emerald-600'
                  }`}
                />
                <div className="text-xs sm:text-sm">
                  {isTeacherSyncMode ? (
                    <>
                      <strong className="text-amber-300">
                        【📡 課堂大螢幕同步引導模式】
                      </strong>{' '}
                      目前老師大螢幕正引導全班進行{' '}
                      <span className="px-2 py-0.5 rounded bg-amber-400 text-slate-950 font-black">
                        {STAGES.find((s) => s.id === broadcastStage)?.name}
                      </span>
                      ，您的手機畫面已自動對齊老師進度！完成作答送出後將即時顯示於講台大螢幕。
                    </>
                  ) : (
                    <>
                      <strong>【🏃 學員自由闖關模式】</strong>{' '}
                      您可以依照自己的節奏，從 G0 一路解鎖完成至 G6 產出報告。
                    </>
                  )}
                </div>
              </div>

              <div className="flex items-center gap-2">
                {role === 'teacher' ? (
                  <div className="flex items-center gap-1.5">
                    <button
                      type="button"
                      onClick={() =>
                        handleTogglePacingMode(
                          isTeacherSyncMode ? 'self_paced' : 'teacher_sync'
                        )
                      }
                      className="px-3 py-1 rounded-lg bg-white/15 hover:bg-white/25 text-xs font-extrabold border border-white/20 cursor-pointer"
                    >
                      {isTeacherSyncMode ? '切換為學員自由闖關' : '切換為跟隨老師同步'}
                    </button>
                    <button
                      type="button"
                      onClick={() => {
                        setLiveWallStageFilter(broadcastStage);
                        setIsLiveWallOpen(true);
                      }}
                      className="px-3 py-1 rounded-lg bg-amber-400 hover:bg-amber-300 text-slate-950 text-xs font-black flex items-center gap-1 cursor-pointer"
                    >
                      <Monitor className="w-3.5 h-3.5" /> 開啟大螢幕控台
                    </button>
                  </div>
                ) : (
                  isTeacherSyncMode &&
                  selectedStageId !== broadcastStage && (
                    <button
                      type="button"
                      onClick={() => setSelectedStageId(broadcastStage)}
                      className="px-3 py-1 rounded-lg bg-amber-400 text-slate-950 text-xs font-black cursor-pointer"
                    >
                      立即回到老師當前關卡 ({broadcastStage})
                    </button>
                  )
                )}
              </div>
            </div>

            <div className="bg-white rounded-2xl p-4 border-2 border-slate-200 flex flex-wrap items-center justify-between gap-3 shadow-2xs">
              <div className="flex flex-wrap items-center gap-3">
                <button
                  type="button"
                  onClick={() => setActiveView('home')}
                  className="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-extrabold flex items-center gap-1 cursor-pointer"
                >
                  <ChevronLeft className="w-4 h-4" /> 更換情境
                </button>
                <div>
                  <div className="text-xs font-bold text-indigo-700">
                    {activeScenario.id} • {activeScenario.industryName}
                  </div>
                  <h2 className="text-base sm:text-lg font-extrabold text-slate-900">
                    {activeScenario.title}
                  </h2>
                </div>
              </div>

              <div className="flex flex-wrap items-center gap-2">
                <StatusBadge state={activeSession.uiState} />
                <AssistanceBadge level={currentAssistance} />
                {role === 'teacher' && (
                  <button
                    type="button"
                    onClick={handleTeacherUnlockNextStage}
                    className="px-3 py-1.5 rounded-xl bg-purple-600 hover:bg-purple-500 text-white text-xs font-extrabold flex items-center gap-1 cursor-pointer"
                  >
                    <Unlock className="w-3.5 h-3.5" /> 教師人工解鎖下一關
                  </button>
                )}
              </div>
            </div>

            <div className="flex lg:hidden bg-slate-200 p-1 rounded-xl">
              <button
                type="button"
                onClick={() => setMobileLearnTab('story')}
                className={`flex-1 py-2.5 rounded-lg text-sm font-extrabold cursor-pointer ${
                  mobileLearnTab === 'story' ? 'bg-white text-indigo-950 shadow-xs' : 'text-slate-700'
                }`}
              >
                動作 ①：讀故事、看關係圖與勾選事實
              </button>
              <button
                type="button"
                onClick={() => setMobileLearnTab('coach')}
                className={`flex-1 py-2.5 rounded-lg text-sm font-extrabold cursor-pointer ${
                  mobileLearnTab === 'coach' ? 'bg-white text-indigo-950 shadow-xs' : 'text-slate-700'
                }`}
              >
                動作 ② & ③：G0–G6 闖關作答 ({selectedStageId})
              </button>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
              <div
                className={`lg:col-span-6 space-y-5 ${
                  mobileLearnTab === 'coach' ? 'hidden lg:block' : 'block'
                }`}
              >
                <MermaidDiagramCard
                  scenario={activeScenario}
                  externalFullscreenTrigger={diagramFullscreenTrigger}
                  onSaveMermaidCode={(newCode) => {
                    setScenarios((prev) =>
                      prev.map((sc) =>
                        sc.id === activeScenario.id ? { ...sc, mermaidCode: newCode } : sc
                      )
                    );
                    showToast('已儲存更新角色利害關係圖！', 'success');
                  }}
                />

                <div className="bg-white rounded-2xl border-2 border-slate-200 p-5 space-y-4 shadow-2xs">
                  <div className="flex flex-wrap items-center justify-between gap-2 border-b border-slate-100 pb-3">
                    <div className="flex items-center gap-2">
                      <span className="px-2.5 py-1 rounded-lg bg-indigo-950 text-amber-400 text-xs font-black">
                        動作 ①
                      </span>
                      <h3 className="text-base font-extrabold text-slate-900">
                        閱讀完整情境敘事（重點數字與矛盾已標粗體）
                      </h3>
                    </div>

                    <div className="flex items-center gap-1.5">
                      <div className="inline-flex bg-slate-100 rounded-lg p-0.5 border border-slate-200">
                        {[
                          { id: 'medium', label: '適中' },
                          { id: 'large', label: '大字' },
                          { id: 'xlarge', label: '特大' }
                        ].map((sz) => (
                          <button
                            key={sz.id}
                            type="button"
                            onClick={() => setStoryFontSize(sz.id)}
                            className={`px-2 py-1 rounded-md text-xs font-bold cursor-pointer ${
                              storyFontSize === sz.id
                                ? 'bg-indigo-600 text-white'
                                : 'text-slate-600 hover:text-slate-900'
                            }`}
                          >
                            {sz.label}
                          </button>
                        ))}
                      </div>
                      <button
                        type="button"
                        onClick={() => setStoryBoldHighlight((v) => !v)}
                        className={`px-2.5 py-1 rounded-lg text-xs font-extrabold border cursor-pointer ${
                          storyBoldHighlight
                            ? 'bg-amber-100 text-amber-950 border-amber-400'
                            : 'bg-slate-100 text-slate-600 border-slate-300'
                        }`}
                      >
                        重點粗體高光
                      </button>
                    </div>
                  </div>

                  <FormattedStoryBlock
                    story={activeScenario.story}
                    fontSizeLevel={storyFontSize}
                    boldHighlight={storyBoldHighlight}
                  />
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div className="bg-emerald-50/70 rounded-2xl p-4 border-2 border-emerald-200 space-y-2.5">
                    <h4 className="text-sm font-extrabold text-emerald-950 flex items-center justify-between">
                      <span>✅ 已知客觀事實 (Facts)</span>
                      <span className="text-xs bg-emerald-200 text-emerald-900 px-2 py-0.5 rounded-full">
                        已勾選 {activeSession.checkedFacts.length} 項
                      </span>
                    </h4>
                    <div className="space-y-2">
                      {(activeScenario.facts || []).map((fact, idx) => {
                        const checked = activeSession.checkedFacts.includes(idx);
                        return (
                          <label
                            key={idx}
                            onClick={() => toggleFactCheck(idx)}
                            className={`flex items-start gap-2.5 p-2.5 rounded-xl border text-sm cursor-pointer transition ${
                              checked
                                ? 'bg-white border-emerald-500 text-slate-900 font-bold shadow-2xs'
                                : 'bg-white/60 border-emerald-200 text-slate-700'
                            }`}
                          >
                            {checked ? (
                              <CheckSquare className="w-4 h-4 text-emerald-600 shrink-0 mt-0.5" />
                            ) : (
                              <Square className="w-4 h-4 text-slate-400 shrink-0 mt-0.5" />
                            )}
                            <span>{fact}</span>
                          </label>
                        );
                      })}
                    </div>
                  </div>

                  <div className="bg-amber-50/70 rounded-2xl p-4 border-2 border-amber-200 space-y-2.5">
                    <h4 className="text-sm font-extrabold text-amber-950 flex items-center justify-between">
                      <span>❓ 待查關鍵未知 (Unknowns)</span>
                      <span className="text-xs bg-amber-200 text-amber-900 px-2 py-0.5 rounded-full">
                        已勾選 {activeSession.checkedUnknowns.length} 項
                      </span>
                    </h4>
                    <div className="space-y-2">
                      {(activeScenario.unknowns || []).map((unk, idx) => {
                        const checked = activeSession.checkedUnknowns.includes(idx);
                        return (
                          <label
                            key={idx}
                            onClick={() => toggleUnknownCheck(idx)}
                            className={`flex items-start gap-2.5 p-2.5 rounded-xl border text-sm cursor-pointer transition ${
                              checked
                                ? 'bg-white border-amber-500 text-slate-900 font-bold shadow-2xs'
                                : 'bg-white/60 border-amber-200 text-slate-700'
                            }`}
                          >
                            {checked ? (
                              <CheckSquare className="w-4 h-4 text-amber-600 shrink-0 mt-0.5" />
                            ) : (
                              <Square className="w-4 h-4 text-slate-400 shrink-0 mt-0.5" />
                            )}
                            <span>{unk}</span>
                          </label>
                        );
                      })}
                    </div>
                  </div>
                </div>
              </div>

              <div
                className={`lg:col-span-6 space-y-5 ${
                  mobileLearnTab === 'story' ? 'hidden lg:block' : 'block'
                }`}
              >
                <div className="bg-white rounded-2xl border-2 border-indigo-200 p-4 space-y-3 shadow-2xs">
                  <div className="flex flex-wrap items-center justify-between gap-2">
                    <div className="flex items-center gap-2">
                      <span className="px-2.5 py-1 rounded-lg bg-indigo-950 text-amber-400 text-xs font-black">
                        動作 ②
                      </span>
                      <span className="text-sm font-extrabold text-slate-900">
                        選擇思考關卡（由 G0 依序解鎖至 G6）
                      </span>
                    </div>
                    <button
                      type="button"
                      onClick={() => setDiagramFullscreenTrigger((c) => c + 1)}
                      className="px-3 py-1.5 rounded-xl bg-amber-400 hover:bg-amber-300 text-slate-950 text-xs font-extrabold flex items-center gap-1 shadow-2xs cursor-pointer"
                    >
                      <Maximize2 className="w-3.5 h-3.5" /> 🔍 放大看「角色利害關係與關鍵數字圖」
                    </button>
                  </div>

                  <div className="grid grid-cols-7 gap-1.5">
                    {STAGES.map((st, idx) => {
                      const unlockedIdx = STAGES.findIndex((s) => s.id === activeSession.currentStage);
                      const broadcastIdx = STAGES.findIndex((s) => s.id === broadcastStage);
                      const isUnlocked =
                        role === 'teacher'
                          ? true
                          : isTeacherSyncMode
                          ? idx <= broadcastIdx
                          : idx <= unlockedIdx;
                      const isPassed = activeSession.responses?.[st.id]?.passed;
                      const isCurrent = selectedStageId === st.id;
                      const isTeacherTarget = isTeacherSyncMode && st.id === broadcastStage;

                      return (
                        <button
                          key={st.id}
                          type="button"
                          disabled={!isUnlocked}
                          onClick={() => {
                            if (role === 'teacher' && isTeacherSyncMode) {
                              handleSetClassroomStage(st.id);
                            } else {
                              setSelectedStageId(st.id);
                            }
                          }}
                          className={`p-2 rounded-xl border-2 text-center transition flex flex-col items-center justify-center gap-0.5 cursor-pointer disabled:opacity-40 disabled:cursor-not-allowed relative ${
                            isCurrent
                              ? 'bg-indigo-950 text-white border-indigo-950 shadow-sm'
                              : isPassed
                              ? 'bg-emerald-50 text-emerald-900 border-emerald-300'
                              : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'
                          }`}
                        >
                          {isTeacherTarget && (
                            <span className="absolute -top-2 px-1.5 py-0.2 rounded-full bg-amber-400 text-slate-950 text-[9px] font-black">
                              老師引導中
                            </span>
                          )}
                          <div className="text-xs font-black flex items-center gap-0.5">
                            <span>{st.id}</span>
                            {isPassed && <CheckCircle2 className="w-3 h-3 text-emerald-500" />}
                            {!isUnlocked && <Lock className="w-3 h-3" />}
                          </div>
                          <div className="text-[11px] font-bold truncate w-full">{st.shortName}</div>
                        </button>
                      );
                    })}
                  </div>
                </div>

                <div className="bg-white rounded-2xl border-2 border-slate-200 p-5 space-y-4 shadow-2xs">
                  <div className="flex flex-wrap items-center justify-between gap-2 border-b border-slate-100 pb-3">
                    <div>
                      <span className="text-xs font-black text-indigo-600 uppercase">
                        動作 ③ • 第 {currentStageObj.stepNum} 關（{currentStageObj.dimension}）
                      </span>
                      <h3 className="text-xl font-black text-slate-900">{currentStageObj.name}</h3>
                    </div>
                    <div className="flex flex-wrap items-center gap-1.5">
                      <button
                        type="button"
                        onClick={() => {
                          setActiveCodexStageId(selectedStageId);
                          setIsKnowledgeCodexOpen(true);
                        }}
                        className="px-3 py-1.5 rounded-xl bg-indigo-950 hover:bg-indigo-800 text-amber-300 text-xs font-extrabold flex items-center gap-1 shadow-2xs cursor-pointer"
                      >
                        <Brain className="w-3.5 h-3.5" /> 📚 點此學本關 ({selectedStageId}) 理論與方法寶典
                      </button>
                      <button
                        type="button"
                        onClick={handleRequestHint}
                        className="px-3 py-1.5 rounded-xl bg-amber-100 hover:bg-amber-200 text-amber-950 text-xs font-extrabold flex items-center gap-1 border border-amber-300 cursor-pointer"
                      >
                        <Lightbulb className="w-3.5 h-3.5" /> 點我看提示 (Hint)
                      </button>
                      <button
                        type="button"
                        onClick={handleRequestDemo}
                        className="px-3 py-1.5 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-900 text-xs font-extrabold flex items-center gap-1 border border-rose-200 cursor-pointer"
                      >
                        <Sparkles className="w-3.5 h-3.5" /> 看寫法示範 (Demo)
                      </button>
                    </div>
                  </div>

                  <div className="bg-slate-50 rounded-xl p-3.5 border border-slate-200 space-y-1.5 text-sm">
                    <div className="font-extrabold text-slate-900">
                      🎯 本關任務：{currentStageObj.task}
                    </div>
                    <div className="text-xs text-slate-600">
                      ✅ 過關條件：{currentStageObj.criteria}
                    </div>
                  </div>

                  {showHintBox && (
                    <div className="bg-amber-50 border-l-4 border-amber-500 p-3.5 rounded-r-xl text-sm text-amber-950">
                      <strong>💡 思考提示 (Hint)：</strong> {currentStageObj.hint}
                    </div>
                  )}

                  {showDemoBox && (
                    <div className="bg-rose-50 border-l-4 border-rose-500 p-3.5 rounded-r-xl text-sm text-rose-950">
                      <strong>📝 結構示範（已記錄輔助層級為 Demo，請勿直接照抄）：</strong>
                      <p className="mt-1">{currentStageObj.demo}</p>
                    </div>
                  )}

                  <div className="bg-indigo-950 text-white rounded-2xl p-4 space-y-2">
                    <div className="text-xs font-black text-amber-400 flex items-center gap-1.5">
                      <Brain className="w-4 h-4" /> AI 蘇格拉底教練 • 單一必要問題追問
                    </div>
                    <p className="text-sm sm:text-base font-bold leading-relaxed">
                      {currentFeedback?.question || currentStageObj.coachQuestion}
                    </p>
                    {currentFeedback?.missingCriteria?.length > 0 && (
                      <div className="pt-2 border-t border-indigo-800 text-xs text-amber-300">
                        待補強項目：{currentFeedback.missingCriteria.join('、')}
                      </div>
                    )}
                  </div>

                  <div className="space-y-2">
                    <label className="block text-sm font-extrabold text-slate-800">
                      您的結構化思考作答（支援課堂中斷恢復與版本紀錄）：
                    </label>
                    <textarea
                      value={draftResponse}
                      onChange={(e) => setDraftResponse(e.target.value)}
                      rows={6}
                      placeholder={`請在此輸入您對 ${currentStageObj.name} 的分析與推論...`}
                      className="w-full p-4 rounded-2xl border-2 border-slate-300 focus:border-indigo-600 focus:outline-none text-base leading-relaxed"
                    />
                  </div>

                  <div className="flex flex-wrap items-center justify-between gap-3 pt-2">
                    <button
                      type="button"
                      onClick={handleSaveDraft}
                      className="px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 text-sm font-extrabold flex items-center gap-1.5 cursor-pointer"
                    >
                      <Save className="w-4 h-4" /> 暫存草稿並同步大螢幕
                    </button>

                    <button
                      type="button"
                      onClick={handleSubmitStageResponse}
                      className="px-6 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-sm sm:text-base font-extrabold flex items-center gap-2 shadow-md cursor-pointer"
                    >
                      <Send className="w-4 h-4" />
                      <span>送出 {selectedStageId} 作答並驗證過關</span>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        );
      };

      // ============================================================================
      // 12. 渲染【第 3 步：六指標 12 分規準評量報告與教師覆核】
      // ============================================================================

      const renderReportView = () => {
        if (!activeSession) return null;
        const scores = activeSession.assessment?.scores || {
          assumption: 2,
          perspective: 2,
          method: 1,
          evidence: 2,
          habit: 1,
          metacognition: 1
        };
        const totalScore = Object.values(scores).reduce((a, b) => a + b, 0);

        const handleTeacherScoreOverride = (criterionKey, newScore) => {
          if (role !== 'teacher') return;
          setSessions((prev) =>
            prev.map((s) => {
              if (s.id !== activeSession.id) return s;
              return {
                ...s,
                assessment: {
                  ...s.assessment,
                  reviewStatus: 'approved',
                  scores: {
                    ...s.assessment.scores,
                    [criterionKey]: newScore
                  }
                }
              };
            })
          );
          showToast(`教師已覆核更新「${criterionKey}」指標分數為 ${newScore} 分！`, 'success');
        };

        return (
          <div className="space-y-6">
            <div className="bg-gradient-to-r from-indigo-950 via-indigo-900 to-slate-900 rounded-3xl p-6 sm:p-8 text-white flex flex-wrap items-center justify-between gap-6">
              <div className="space-y-2">
                <span className="px-3 py-1 rounded-full bg-amber-400 text-slate-950 text-xs font-black">
                  STEP 3 個人思考規準評量報告
                </span>
                <h2 className="text-2xl sm:text-3xl font-black">
                  {activeSession.studentName} — 六指標 12 分規準報告
                </h2>
                <p className="text-sm text-indigo-200">
                  演練情境：{activeScenario?.title}｜規準版本：{activeSession.assessment?.rubricVersion || 'rubric-1.0'}
                </p>
              </div>

              <div className="bg-white/10 border border-white/20 rounded-2xl px-6 py-4 text-center">
                <div className="text-xs text-indigo-200 font-bold">六指標總分（滿分 12 分）</div>
                <div className="text-4xl font-black text-amber-400 mt-1">{totalScore} / 12</div>
                <div className="text-[11px] text-slate-300 mt-1">
                  * 單次練習分數僅反映本情境表現，非智力或人格測量
                </div>
              </div>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
              {RUBRIC_CRITERIA.map((rc) => {
                const val = scores[rc.key] ?? 1;
                return (
                  <div
                    key={rc.key}
                    className="bg-white rounded-2xl p-5 border-2 border-slate-200 flex flex-col justify-between gap-4 shadow-2xs"
                  >
                    <div className="space-y-2">
                      <div className="flex items-center justify-between">
                        <span className="text-xs font-black text-indigo-600 bg-indigo-50 px-2.5 py-0.5 rounded-md">
                          對應：{rc.stageRef}
                        </span>
                        <span className="text-lg font-black text-slate-900">{val} / 2 分</span>
                      </div>
                      <h3 className="text-lg font-extrabold text-slate-900">{rc.label}</h3>
                      <p className="text-sm text-slate-600">{rc.levels[val]}</p>
                    </div>

                    {role === 'teacher' && (
                      <div className="pt-3 border-t border-slate-100 flex items-center justify-between">
                        <span className="text-xs font-bold text-purple-800">教師人工覆核調分：</span>
                        <div className="flex gap-1">
                          {[0, 1, 2].map((num) => (
                            <button
                              key={num}
                              type="button"
                              onClick={() => handleTeacherScoreOverride(rc.key, num)}
                              className={`px-2.5 py-1 rounded-lg text-xs font-black cursor-pointer ${
                                val === num
                                  ? 'bg-purple-600 text-white'
                                  : 'bg-slate-100 text-slate-700 hover:bg-slate-200'
                              }`}
                            >
                              {num}分
                            </button>
                          ))}
                        </div>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>

            <div className="bg-white rounded-3xl p-6 border-2 border-slate-200 space-y-4">
              <h3 className="text-lg font-extrabold text-slate-900">
                📌 G0–G6 思考演進軌跡與輔助層級紀錄
              </h3>
              <div className="space-y-3">
                {STAGES.map((st) => {
                  const resp = activeSession.responses?.[st.id];
                  return (
                    <div key={st.id} className="p-4 rounded-2xl bg-slate-50 border border-slate-200 space-y-1.5">
                      <div className="flex flex-wrap items-center justify-between gap-2">
                        <span className="font-extrabold text-indigo-950">{st.name}</span>
                        {resp ? (
                          <AssistanceBadge level={resp.assistanceLevel} />
                        ) : (
                          <span className="text-xs text-slate-400">尚未提交</span>

                      </div>
                      <p className="text-sm text-slate-700 leading-relaxed">
                        {resp?.content || '（尚無作答紀錄）'}
                      </p>
                    </div>

          </div>
        );

      // ============================================================================
      // 13. 渲染【教師課堂管理、情境題庫中心、BYOK 設定與 Admin 管理者後台】
      // ============================================================================

      const FIRESTORE_RULES_SNIPPET = `rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    function isCreatorAdmin() {
      return request.auth != null && request.auth.token.email == 'mindnodeai@gmail.com';
    }
    match /users/{userId} {
      allow read: if true;
      allow create, update: if request.auth != null || true;
      allow delete: if isCreatorAdmin() && resource.data.email != 'mindnodeai@gmail.com';
    }
    match /classrooms/{classCode} {
      allow read, write: if true;
    }
    match /scenarios/{scenarioId} {
      allow read, write: if true;
    }
    match /sessions/{sessionId} {
      allow read, write: if true;
    }
  }
}`;

      const renderFirestoreRulesModal = () => {
        if (!showFirestoreRulesModal) return null;
        return (
          <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-xs flex items-center justify-center p-4">

              <div className="flex items-center justify-between border-b border-slate-200 pb-3">
                <div className="flex items-center gap-2.5">
                  <Shield className="w-6 h-6 text-indigo-600" />
                  <div>
                    <h3 className="text-lg sm:text-xl font-black text-slate-900">
                      🛡️ Firebase Firestore 安全規則 (Rules) 設定指南
                    </h3>
                    <p className="text-xs text-slate-500">
                      貼上此規則即可讓「老師電腦建課、客製化情境、學員手機免登入掃碼投遞大螢幕」100% 跨裝置即時同步！
                    </p>
                  </div>
                </div>
                <button
                  type="button"
                  onClick={() => setShowFirestoreRulesModal(false)}
                  className="p-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 cursor-pointer"
                >
                  <X className="w-5 h-5" />
                </button>
              </div>

              <div className="bg-amber-50 border-l-4 border-amber-500 p-3.5 rounded-r-xl text-xs sm:text-sm text-amber-950 space-y-1">
                <div className="font-extrabold">📌 為什麼需要更新 Firestore Rules？</div>
                <div>
                  1. 當學員拿手機掃描 QR Code 進入「極簡互動模式」時，並未進行傳統 Email 帳號登入（此時 <code className="bg-white px-1 rounded">request.auth == null</code>），若舊規則寫死 <code className="bg-white px-1 rounded">if request.auth != null</code>，學員手機就會讀不到老師建立的課程，也無法把答案投遞到大螢幕。<br />
                  2. 下方規則已同時開放 <code className="bg-white px-1 rounded">classrooms</code>、<code className="bg-white px-1 rounded">scenarios</code>、<code className="bg-white px-1 rounded">sessions</code> 跨裝置課堂互動讀寫，並永久保護 <code className="bg-white px-1 rounded">mindnodeai@gmail.com</code> 創作者權限。
                </div>
              </div>

              <div className="space-y-2">
                <div className="flex items-center justify-between">
                  <span className="text-xs font-extrabold text-slate-700">
                    請前往 Firebase Console ➔ Firestore Database ➔ 規則 (Rules) 貼上並發布：
                  </span>
                  <button
                    type="button"
                    onClick={() => {
                      const textarea = document.createElement('textarea');
                      textarea.value = FIRESTORE_RULES_SNIPPET;
                      document.body.appendChild(textarea);
                      textarea.select();
                      document.execCommand('copy');
                      document.body.removeChild(textarea);
                      showToast('✅ 已複製 Firestore Rules 程式碼！請直接貼到 Firebase Console 並按發布。', 'success');
                    }}
                    className="px-3.5 py-1.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-extrabold flex items-center gap-1.5 cursor-pointer"
                  >
                    <Copy className="w-3.5 h-3.5" /> 一鍵複製規則程式碼
                  </button>
                </div>
                <pre className="bg-slate-950 text-emerald-300 p-4 rounded-2xl text-xs font-mono overflow-x-auto leading-relaxed border border-slate-800">
                  {FIRESTORE_RULES_SNIPPET}
                </pre>
              </div>

              <div className="flex justify-end pt-2">
                <button
                  type="button"
                  onClick={() => setShowFirestoreRulesModal(false)}
                  className="px-5 py-2 rounded-xl bg-slate-900 text-white text-sm font-extrabold cursor-pointer"
                >
                  關閉視窗
                </button>
              </div>
            </div>
          </div>
        );
      };

        const activeJoinCodeUpper = (activeClassroom?.joinCode || 'TONY26').toUpperCase();
        const currentClassSessions = sessions.filter((s) => {
          const sJoin = (s.joinCode || '').toUpperCase();
          return (
            !s.classId ||
            (sJoin && sJoin === activeJoinCodeUpper) ||

            s.classId === `CLS-QR-${activeJoinCodeUpper}` ||

                const isSelected = cls.id === activeClassroom?.id;

                  scenarios.find((sc) => sc.id === cls.scenarioId) || scenarios[0];
                const classStuCount = sessions.filter((s) => s.classId === cls.id).length;
                return (
                  <div
                    key={cls.id}

                      showToast(`已切換至課堂「${cls.title} (${cls.joinCode})」`, 'info');
                    }}
                    className={`p-4 rounded-2xl border-2 transition cursor-pointer flex flex-col justify-between gap-3 ${
                      isSelected
                        ? 'bg-indigo-950 text-white border-indigo-950 shadow-md ring-2 ring-amber-400'
                        : 'bg-slate-50 hover:bg-indigo-50/50 text-slate-900 border-slate-200'

                            isSelected
                              ? 'bg-amber-400 text-slate-950'
                              : 'bg-indigo-100 text-indigo-900'
                          }`}
                        >
                          加入碼：{cls.joinCode}
                        </span>
                        <span
                          className={`text-xs font-bold ${
                            isSelected ? 'text-indigo-200' : 'text-slate-500'
                          }`}
                        >
                          作答紀錄：{classStuCount} 筆
                        </span>
                      </div>
                      <div className="font-extrabold text-base leading-snug">{cls.title}</div>
                      <div

                          isSelected ? 'text-amber-300 font-bold' : 'text-indigo-700 font-bold'

                                setActiveClassId(nextList[0].id);
                              }
                              try {
                                await deleteDoc(doc(db, 'classrooms', cls.joinCode.toUpperCase()));
                              } catch (err) {}
                              showToast(`已刪除課程 ${cls.title}`, 'info');
                            }}
                            className={`px-2 py-0.5 rounded font-bold cursor-pointer ${

                    const nextScenId = e.target.value;

                    setClassrooms((prev) =>
                      prev.map((c) => (c.id === activeClassroom.id ? updatedCls : c))
                    );
                    try {
                      await setDoc(
                        doc(db, 'classrooms', updatedCls.joinCode.toUpperCase()),
                        updatedCls,
                        { merge: true }
                      );
                    } catch (err) {}
                    const targetScen = scenarios.find((s) => s.id === nextScenId);
                    showToast(
                      `已將本課堂演練情境切換為「${targetScen?.title}」並同步儲存！`,
                      'success'
                    );
                  }}
                  className="px-3 py-1 rounded-xl border-2 border-indigo-200 text-xs font-extrabold text-indigo-950 bg-indigo-50/60"
                >
                  {customScenariosList.length > 0 && (
                    <optgroup label="★ 您自訂生成的客製化情境">
                      {customScenariosList.map((sc) => (
                        <option key={sc.id} value={sc.id}>

                  <optgroup label="📂 10 大產業預設實戰情境 (50題)">
                    {defaultScenariosList.map((sc) => (
                      <option key={sc.id} value={sc.id}>
                        [{sc.industryName}] {sc.title}
                      </option>
                    ))}
                  </optgroup>
                </select>
              </div>

            <div className="flex flex-wrap items-center gap-2.5">
              <button
                type="button"
                onClick={() => setIsQrPosterOpen(true)}

                <QrCode className="w-4 h-4" /> 📱 投影全螢幕 QR Code 掃碼海報

              <button
                type="button"
                onClick={() => {
                  setLiveWallStageFilter(activeClassroom?.activeBroadcastStage || 'G0');
                  setIsLiveWallOpen(true);
                }}

              >
                <Monitor className="w-4 h-4" /> 📺 開啟課堂大螢幕互動答案牆
              </button>
              <button
                type="button"
                onClick={() => {
                  setIsQrStudentMode(true);
                  setQrStudentCheckedIn(true);
                }}
                className="px-4 py-2.5 rounded-xl bg-amber-400 hover:bg-amber-300 text-slate-950 text-sm font-extrabold flex items-center gap-1.5 cursor-pointer shadow-xs"
              >

              <button
                type="button"
                onClick={handleExportClassCsv}

              >

              </button>
            </div>
          </div>

          <div className="bg-gradient-to-r from-indigo-950 via-slate-900 to-indigo-950 text-white rounded-3xl p-6 border-2 border-amber-400/70 shadow-md space-y-4">
            <div className="flex flex-wrap items-center justify-between gap-4">
              <div className="space-y-1">
                <div className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-amber-400 text-slate-950 text-xs font-black">

                    activeClassroom?.pacingMode === 'teacher_sync'
                      ? 'bg-amber-400 text-slate-950 shadow-xs'
                      : 'text-slate-300 hover:text-white'

                return (

                    key={st.id}
                    type="button"
                    onClick={() => handleSetClassroomStage(st.id)}
                    className={`p-3 rounded-2xl border-2 text-left transition cursor-pointer flex flex-col justify-between gap-1 ${
                      isBroadcast
                        ? 'bg-amber-400 text-slate-950 border-white shadow-lg scale-[1.02]'
                        : 'bg-slate-800/90 text-slate-200 border-slate-700 hover:bg-slate-800'
                    }`}
                  >
                    <div className="flex items-center justify-between">
                      <span className="text-sm font-black">{st.id}</span>
                      {isBroadcast && (

                  </button>

              })}

            <div className="grid grid-cols-1 md:grid-cols-12 gap-4 items-end">

                >

                    <optgroup label="★ 您自訂生成的客製化情境">
                      {customScenariosList.map((sc) => (

                          ★ [客製化｜{sc.industryName}] {sc.title}
                        </option>
                      ))}
                    </optgroup>
                  )}
                  <optgroup label="📂 10 大產業預設實戰情境 (50題)">
                    {defaultScenariosList.map((sc) => (
                      <option key={sc.id} value={sc.id}>

                      joinExpiresAt: '2026-12-31 23:59',
                      status: 'active',
                      scenarioId: newClassScenarioId,
                      allowAiDemo: newClassAllowDemo,
                      pacingMode: 'teacher_sync',

                    <th className="p-3">目前關卡</th>

                    <th className="p-3">狀態</th>
                    <th className="p-3">六指標總分</th>
                    <th className="p-3">操作</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-200">
                  {currentClassSessions.map((s) => {
                    const sc = s.assessment?.scores || {};
                    const total = Object.values(sc).reduce((a, b) => a + b, 0);
                    const latestResp =
                      s.responses?.[s.currentStage]?.content ||
                      Object.values(s.responses || {})[0]?.content ||
                      '尚未送出文字';
                    return (
                      <tr key={s.id} className="hover:bg-slate-50">

                        </td>

                        </td>

                            type="button"
                            onClick={() => {
                              setActiveSessionId(s.id);

          (sc) => sc.industryId === selectedIndustryId

          if (!genTopicInput.trim()) {
            showToast('請先輸入想探討的情境主題或商業兩難！', 'error');
            return;
          }
          setIsGeneratingScenario(true);
          await new Promise((r) => setTimeout(r, 800));
          const targetInd =
            INDUSTRY_CATALOG.find((i) => i.id === selectedIndustryId) || INDUSTRY_CATALOG[0];
          const newId = `SC${String(scenarios.length + 1).padStart(2, '0')}`;
          const baseCreated = buildScenarioItem(
            newId,
            targetInd.id,
            targetInd.name,
            genTopicInput.trim(),
            `${targetInd.name}轉型與指標衝突`,
            `導入「${genTopicInput.trim()}」自動化與新考核機制`,
            '首季表面效率提升 **42%**，單位作業成本下降 **28%**',
            '高價值客戶淨推薦值 (**NPS**) 下滑 **16 點**，資深關鍵人員離職率增加 **1.8 倍**',
            '第一線團隊承受雙倍複雜度個案，卻仍受限於舊制「**單日件數 KPI**」考核',
            '表面 42% 效率提升中，有多少比例屬於假性結案或風險遞延？',
            '高價值客戶流失是否集中在特定高複雜度服務場景？',
            '若同步調整第一線人員加權考核指標，成本與留存率的平衡點為何？'
          );

            ...baseCreated,
            isCustom: true,
            createdAt: new Date().toISOString().replace('T', ' ').slice(0, 16)
          };

          setScenarios((prev) => [created, ...prev]);
          // 自動將新建課堂的預設選單選中此客製化情境！
          setNewClassScenarioId(created.id);
          setSessions((prev) =>
            prev.map((s) => (s.id === activeSession.id ? { ...s, scenarioId: created.id } : s))
          );

          try {
            await setDoc(doc(db, 'scenarios', created.id), created, { merge: true });
          } catch (e) {}

          setGenTopicInput('');
          setIsGeneratingScenario(false);
          showToast(
            `💾 已生成客製化情境「${created.id} ${created.title}」！已自動加入課堂下拉選單並永久儲存於【${targetInd.name}】目錄！`,
            'success'

                  ✨ AI 自訂生成新情境（自動繪製 100% 數據對齊之角色利害關係圖並歸檔至產業目錄）
                </h2>
                <span className="text-xs font-extrabold px-3 py-1 rounded-full bg-indigo-50 text-indigo-900 border border-indigo-200">

                </span>
              </div>
              <div className="grid grid-cols-1 md:grid-cols-12 gap-4 items-end">

                      </option>

                  <label className="block text-xs font-bold text-slate-700 mb-1">

                  </label>
                  <input
                    type="text"
                    value={genTopicInput}
                    onChange={(e) => setGenTopicInput(e.target.value)}

                  />

                <div className="md:col-span-3">
                  <button
                    type="button"
                    disabled={isGeneratingScenario}

                    <Sparkles className="w-4 h-4" />
                    <span>{isGeneratingScenario ? 'AI 生成中...' : '生成情境與關係圖並儲存'}</span>
                  </button>
                </div>
              </div>

            {/* 兩層式題庫瀏覽與切換預覽器 */}
            <div className="bg-white rounded-3xl p-6 border-2 border-slate-200 space-y-5">
              <h3 className="text-lg font-extrabold text-slate-900">
                📂 瀏覽與審核 10 大產業情境題庫（點選任一情境即可於下方檢視與編輯其角色利害關係圖）
              </h3>

              <div className="grid grid-cols-2 sm:grid-cols-5 gap-2.5">
                {INDUSTRY_CATALOG.map((ind) => {
                  const count = scenarios.filter((s) => s.industryId === ind.id).length;
                  const isSelected = selectedIndustryId === ind.id;
                  return (
                    <button
                      key={ind.id}
                      type="button"
                      onClick={() => setSelectedIndustryId(ind.id)}
                      className={`p-3 rounded-2xl border-2 text-left transition cursor-pointer flex items-center justify-between ${
                        isSelected

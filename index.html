                          : 'bg-slate-50 hover:bg-indigo-50/60 text-slate-800 border-slate-200'
                      }`}
                    >
                      <span className="text-xs sm:text-sm font-extrabold truncate">
                        {ind.icon} {ind.name}
                      </span>
                      <span
                        className={`text-[11px] font-black px-2 py-0.5 rounded-full shrink-0 ${
                          isSelected ? 'bg-amber-400 text-slate-950' : 'bg-slate-200 text-slate-700'
                        }`}
                      >
                        {count}
                      </span>
                    </button>
                  );
                })}
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                {filteredIndustryScenarios.map((sc) => {
                  const isCurrentPreview = activeScenario?.id === sc.id;
                  return (
                    <div
                      key={sc.id}
                      onClick={() => {
                        setSessions((prev) =>
                          prev.map((s) =>
                            s.id === activeSession.id ? { ...s, scenarioId: sc.id } : s
                          )
                        );
                        showToast(`已切換預覽情境：${sc.title}`, 'info');
                      }}
                      className={`p-4 rounded-2xl border-2 cursor-pointer transition flex flex-col justify-between gap-3 ${
                        isCurrentPreview
                          ? 'bg-indigo-50/80 border-indigo-600 shadow-xs'
                          : 'bg-white hover:bg-slate-50 border-slate-200'
                      }`}
                    >
                      <div className="space-y-1">
                        <div className="flex items-center justify-between text-xs">
                          <span className="font-black text-indigo-700">
                            {sc.id} {sc.isCustom ? '★ [客製化情境]' : ''}
                          </span>
                          {isCurrentPreview && (
                            <span className="px-2 py-0.5 rounded bg-indigo-600 text-white font-bold text-[11px]">
                              目前預覽中
                            </span>
                          )}

                        <div className="font-extrabold text-slate-900 text-base">{sc.title}</div>

                      </div>
                      <div className="flex flex-wrap items-center justify-between gap-1.5 pt-2 border-t border-slate-200/70">
                        <button
                          type="button"
                          onClick={async (e) => {
                            e.stopPropagation();
                            if (activeClassroom) {
                              const updatedCls = { ...activeClassroom, scenarioId: sc.id };
                              setClassrooms((prev) =>
                                prev.map((c) => (c.id === activeClassroom.id ? updatedCls : c))
                              );
                              try {
                                await setDoc(
                                  doc(db, 'classrooms', updatedCls.joinCode.toUpperCase()),
                                  updatedCls,
                                  { merge: true }
                                );
                              } catch (err) {}
                            }
                            setNewClassScenarioId(sc.id);
                            showToast(
                              `已將「${sc.title}」設為課堂「${activeClassroom?.title}」的指派情境！`,
                              'success'
                            );
                          }}
                          className="px-2.5 py-1 rounded-lg bg-amber-100 hover:bg-amber-200 text-amber-950 text-[11px] font-extrabold cursor-pointer"
                        >
                          📌 指派給當前課堂
                        </button>
                        <button
                          type="button"
                          onClick={(e) => {
                            e.stopPropagation();
                            setSessions((prev) =>
                              prev.map((s) =>
                                s.id === activeSession.id
                                  ? { ...s, scenarioId: sc.id, currentStage: 'G0' }
                                  : s
                              )
                            );
                            setSelectedStageId('G0');
                            setActiveView('learn');
                          }}
                          className="px-2.5 py-1 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-extrabold cursor-pointer"
                        >
                          進入訓練室 ➔
                        </button>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>

            {/* 當前選中情境之角色利害關係圖與故事完整預覽 */}
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
              <div className="lg:col-span-7">
                <MermaidDiagramCard
                  scenario={activeScenario}
                  onSaveMermaidCode={async (newCode) => {
                    const updatedSc = {
                      ...activeScenario,
                      mermaidCode: newCode,
                      updatedAt: new Date().toISOString()
                    };
                    setScenarios((prev) =>
                      prev.map((sc) => (sc.id === activeScenario.id ? updatedSc : sc))
                    );
                    try {
                      await setDoc(doc(db, 'scenarios', updatedSc.id), updatedSc, { merge: true });
                    } catch (e) {}
                    showToast('已更新並永久儲存此情境的 Mermaid 角色關係圖！', 'success');
                  }}
                />
              </div>
              <div className="lg:col-span-5 bg-white rounded-2xl border-2 border-slate-200 p-5 space-y-4">
                <h4 className="text-base font-extrabold text-slate-900 border-b border-slate-100 pb-2">
                  📖 情境敘事預覽：{activeScenario?.title}
                </h4>
                <FormattedStoryBlock
                  story={activeScenario?.story}
                  fontSizeLevel={storyFontSize}
                  boldHighlight={storyBoldHighlight}
                />
              </div>
            </div>
          </div>
        );
      };

      const renderByokSettingsView = () => (
        <div className="max-w-3xl mx-auto bg-white rounded-3xl p-6 sm:p-8 border-2 border-slate-200 space-y-6">
          <div className="flex items-center gap-3">
            <Key className="w-7 h-7 text-indigo-600" />
            <div>
              <h2 className="text-xl font-black text-slate-900">
                BYOK (Bring Your Own Key) 短期安全會話設定
              </h2>
              <p className="text-xs text-slate-500">
                依據規格書第 6 節：API Key 僅保存於當次瀏覽器記憶體會話，絕不寫入 localStorage 或 Firestore。
              </p>
            </div>
          </div>

          <div className="space-y-4">
            <div>
              <label className="block text-sm font-extrabold text-slate-800 mb-1.5">
                輸入您的 Gemini API Key
              </label>
              <input
                type="password"
                value={apiKeyInput}
                onChange={(e) => setApiKeyInput(e.target.value)}
                placeholder="AIzaSy..."
                className="w-full px-4 py-3 rounded-xl border-2 border-slate-300 font-mono text-sm"
              />
            </div>

            <div className="flex flex-wrap gap-3">
              <button
                type="button"
                onClick={() => {
                  if (!apiKeyInput.trim()) {
                    showToast('請先輸入有效的 Gemini API Key', 'error');
                    return;
                  }
                  setByokState({
                    verified: true,
                    sessionId: `KSES-${Date.now().toString().slice(-6)}`,
                    expiresAt: '當次視窗關閉即自動銷毀',
                    scope: byokScope,
                    inMemoryKey: apiKeyInput.trim()
                  });
                  setApiKeyInput('');
                  showToast('API Key 驗證通過！已建立短期記憶體安全會話。', 'success');
                }}
                className="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold text-sm cursor-pointer"
              >
                驗證並啟動安全會話
              </button>

              {byokState.verified && (
                <button
                  type="button"
                  onClick={() => {
                    setByokState({
                      verified: false,
                      sessionId: null,
                      expiresAt: null,
                      scope: 'class_shared',
                      inMemoryKey: ''
                    });
                    showToast('已立即撤銷並清除記憶體中的 API Key 會話！', 'info');
                  }}
                  className="px-5 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-500 text-white font-extrabold text-sm cursor-pointer"
                >
                  立即撤銷並清除 Key
                </button>
              )}
            </div>
          </div>
        </div>
      );

            </div>

            {adminAiReport && (
              <pre className="whitespace-pre-wrap bg-slate-50 p-5 rounded-2xl border border-slate-200 text-sm text-slate-800 leading-relaxed font-sans">
                {adminAiReport}
              </pre>
            )}
          </div>

          {selectedMemberHistory && (
            <div className="fixed inset-0 z-50 bg-slate-950/75 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-lg w-full p-6 space-y-4">
                <div className="flex items-center justify-between">
                  <h4 className="text-lg font-extrabold text-slate-900">
                    🕒 {selectedMemberHistory.realName} 的學習與操作歷史紀錄
                  </h4>
                  <button
                    type="button"
                    onClick={() => setSelectedMemberHistory(null)}
                    className="p-1.5 rounded-lg bg-slate-100 text-slate-700 cursor-pointer"
                  >
                    <X className="w-4 h-4" />
                  </button>
                </div>
                <div className="space-y-2">
                  {(selectedMemberHistory.history || []).map((h, i) => (
                    <div key={i} className="p-3 rounded-xl bg-slate-50 border border-slate-200 text-sm">
                      <div className="text-xs font-bold text-indigo-600">{h.time}</div>
                      <div className="text-slate-800 font-medium">{h.action}</div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}
        </div>
      );

      // ============================================================================
      // 14. 未登入時之會員登入閘門 (Auth Gate + TONY 楊文澤老師完整資歷簡介)
      // ============================================================================

      const zoomStyle =
        fontScale === 'large'
          ? { zoom: 1.1 }
          : fontScale === 'xlarge'
          ? { zoom: 1.18 }
          : { zoom: 1.0 };

      // ============================================================================
      // 13.8 📱 學員掃描 QR Code 專屬極簡課堂互動模式（免複雜選單、直接對應老師當前課程與關卡）
      // ============================================================================

      const handleQrStudentCheckIn = async (e) => {
        if (e) e.preventDefault();
        const cleanCode = (joinCodeInput || activeClassroom?.joinCode || 'TONY26')
          .trim()
          .toUpperCase();
        const finalName =
          studentNameInput.trim() || currentUser?.realName || '現場學員';

        if (!studentNameInput.trim() && !currentUser?.realName) {
          showToast('請輸入您的姓名或組別代號！', 'error');
          return;
        }

        let targetCls =
          classrooms.find((c) => c.joinCode.toUpperCase() === cleanCode) ||
          activeClassroom;

        try {
          const snap = await getDoc(doc(db, 'classrooms', cleanCode));
          if (snap.exists()) {
            targetCls = snap.data();
            setClassrooms((prev) => {
              const map = new Map();
              prev.forEach((c) => map.set(c.joinCode.toUpperCase(), c));
              map.set(cleanCode, targetCls);
              return Array.from(map.values());
            });
          }
        } catch (err) {
          // ignore
        }

        const mySessionId = `SES-${cleanCode}-${finalName
          .replace(/[^a-zA-Z0-9\u4e00-\u9fa5]/g, '')
          .slice(0, 12)}`;

        const existingMySession = sessions.find((s) => s.id === mySessionId);
        const newStuSession = existingMySession
          ? {
              ...existingMySession,
              classId: targetCls.id,
              joinCode: cleanCode,
              scenarioId: targetCls.scenarioId,
              studentName: finalName
            }
          : {
              id: mySessionId,
              classId: targetCls.id,
              joinCode: cleanCode,
              assignmentId: 'ASG-QR-LIVE',
              scenarioId: targetCls.scenarioId || 'SC02',
              studentId: currentUser?.uid || `qr-${Date.now()}`,
              studentName: finalName,
              currentStage: targetCls.activeBroadcastStage || 'G0',
              status: 'in_progress',
              uiState: 'saved',
              startedAt: new Date().toISOString().replace('T', ' ').slice(0, 16),
              finishedAt: null,
              checkedFacts: [0, 1],
              checkedUnknowns: [0],
              responses: {},
              feedback: {},
              assessment: {
                rubricVersion: 'rubric-1.0',
                modelId: 'gemini-2.5-flash',
                reviewStatus: 'pending_review',
                scores: {
                  assumption: 2,
                  perspective: 2,
                  method: 2,
                  evidence: 2,
                  habit: 2,
                  metacognition: 2
                },
                evidence: [],
                actionPlan: '課堂即時互動中'
              }
            };

        setSessions((prev) => {
          const rest = prev.filter((s) => s.id !== mySessionId);
          return [newStuSession, ...rest];
        });
        setActiveClassId(targetCls.id);
        setActiveSessionId(mySessionId);
        setSelectedStageId(targetCls.activeBroadcastStage || 'G0');
        setStudentNameInput(finalName);
        setQrStudentCheckedIn(true);

        if (!currentUser) {
          setCurrentUser({
            uid: newStuSession.studentId,
            email: `${mySessionId.toLowerCase()}@classroom.live`,
            realName: finalName,
            role: 'user',
            isSystemCreator: false,
            memberIdentity: 'TONY老師學員'
          });
        }

        try {
          await ensureQrStudentCloudAuth();
          await setDoc(doc(db, 'sessions', mySessionId), newStuSession, {
            merge: true
          });
        } catch (err) {
          // ignore
        }

        showToast(`🎉 歡迎 ${finalName}！已連線進入「${targetCls.title}」`, 'success');
      };

      if (isQrStudentMode) {
        const broadcastStageId = activeClassroom?.activeBroadcastStage || 'G0';
        const isTeacherSync = activeClassroom?.pacingMode === 'teacher_sync';
        const effectiveStageId = isTeacherSync ? broadcastStageId : selectedStageId;
        const stageInfo =
          STAGES.find((s) => s.id === effectiveStageId) || STAGES[0];
        const mySubmittedResp = activeSession?.responses?.[effectiveStageId];
        const codexInfo =
          KNOWLEDGE_CODEX.find((k) => k.stageId === effectiveStageId) ||
          KNOWLEDGE_CODEX[0];

        return (
          <div
            style={zoomStyle}
            className="min-h-screen bg-slate-950 text-slate-900 flex flex-col justify-between"
          >
            {renderKnowledgeCodexModal()}

            {toast && (
              <div className="fixed bottom-4 left-4 right-4 sm:left-auto sm:right-5 z-50 max-w-md bg-slate-900 text-white px-4 py-3 rounded-2xl shadow-2xl border-2 border-amber-400 flex items-center gap-2 text-sm font-extrabold">
                <Sparkles className="w-5 h-5 text-amber-400 shrink-0" />
                <span>{toast.msg}</span>
              </div>
            )}

            {/* 極簡手機頂部課堂專屬狀態列（無多餘按鈕） */}
            <header className="bg-gradient-to-r from-indigo-950 via-slate-900 to-indigo-950 text-white px-4 py-3 border-b border-indigo-500/40 sticky top-0 z-40">
              <div className="max-w-2xl mx-auto flex items-center justify-between gap-2">
                <div className="flex items-center gap-2.5 min-w-0">
                  <img
                    src={BRAND_LOGO_URL}
                    alt="Logo"
                    className="w-8 h-8 rounded-lg bg-white p-0.5 shrink-0"
                  />
                  <div className="truncate">
                    <div className="flex items-center gap-1.5">
                      <span className="px-2 py-0.5 rounded bg-amber-400 text-slate-950 text-[11px] font-black font-mono">
                        {activeClassroom?.joinCode}
                      </span>
                      <span className="font-black text-sm sm:text-base truncate">
                        {activeClassroom?.title}
                      </span>
                    </div>
                    <div className="text-[11px] text-indigo-200 truncate">
                      情境：{activeScenario?.title}
                    </div>
                  </div>
                </div>

                <button
                  type="button"
                  onClick={() => setIsQrStudentMode(false)}
                  className="px-2.5 py-1 rounded-lg bg-white/10 hover:bg-white/20 text-[11px] text-slate-300 font-bold shrink-0 cursor-pointer"
                >
                  切換完整版
                </button>
              </div>
            </header>

            {/* 尚未報到姓名時：一鍵極簡報到卡 */}
            {!qrStudentCheckedIn ? (
              <main className="flex-1 flex items-center justify-center p-4">
                <div className="bg-white rounded-3xl max-w-md w-full p-6 sm:p-8 shadow-2xl border-2 border-amber-400 space-y-6">
                  <div className="text-center space-y-2">
                    <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-indigo-100 text-indigo-950 text-xs font-black">
                      <Radio className="w-3.5 h-3.5 text-indigo-600 animate-pulse" />
                      已掃碼連入老師指定課堂
                    </span>
                    <h1 className="text-2xl font-black text-slate-900">
                      {activeClassroom?.title}
                    </h1>
                    <div className="p-3.5 rounded-2xl bg-indigo-50 border border-indigo-200 text-left space-y-1">
                      <div className="text-xs font-bold text-indigo-700">
                        📌 本堂互動演練情境：
                      </div>
                      <div className="text-base font-extrabold text-slate-900">
                        {activeScenario?.title}
                      </div>
                    </div>
                  </div>

                  <form onSubmit={handleQrStudentCheckIn} className="space-y-4">
                    <div>
                      <label className="block text-sm font-extrabold text-slate-800 mb-1.5">
                        請輸入您的姓名或組別（將顯示於老師課堂名單）
                      </label>
                      <input
                        type="text"
                        required
                        value={studentNameInput}
                        onChange={(e) => setStudentNameInput(e.target.value)}
                        placeholder="例如：第 3 組 - 王小明"
                        className="w-full px-4 py-3.5 rounded-2xl border-2 border-slate-300 focus:border-indigo-600 focus:outline-none text-base font-extrabold"
                      />
                    </div>

                    <button
                      type="submit"
                      className="w-full py-4 rounded-2xl bg-indigo-600 hover:bg-indigo-500 text-white font-black text-base sm:text-lg shadow-lg flex items-center justify-center gap-2 cursor-pointer"
                    >
                      <span>🚀 立即進入課堂同步作答</span>
                      <ArrowRight className="w-5 h-5" />
                    </button>
                  </form>
                </div>
              </main>
            ) : (
              /* 已報到後：手機專屬極簡同步作答器 */
              <main className="max-w-2xl w-full mx-auto px-3 sm:px-4 py-4 flex-1 space-y-4">
                {/* 1. 老師大螢幕當前同步關卡指示牌 */}
                <div className="bg-gradient-to-r from-amber-400 via-amber-300 to-amber-400 text-slate-950 rounded-2xl p-4 shadow-md flex flex-wrap items-center justify-between gap-2">
                  <div className="flex items-center gap-2.5">
                    <span className="w-9 h-9 rounded-xl bg-slate-950 text-amber-400 font-black text-sm flex items-center justify-center shrink-0">
                      {stageInfo.id}
                    </span>
                    <div>
                      <div className="text-[11px] font-black uppercase tracking-wider flex items-center gap-1">
                        <Radio className="w-3.5 h-3.5 animate-pulse text-rose-700" />
                        <span>老師大螢幕目前引導關卡</span>
                      </div>
                      <div className="text-lg font-black leading-tight">
                        {stageInfo.name}（{stageInfo.dimension}）
                      </div>
                    </div>
                  </div>

                  <div className="text-xs font-extrabold bg-white/80 px-3 py-1 rounded-full">
                    學員：{studentNameInput || currentUser?.realName}
                  </div>
                </div>

                {/* 若老師開放自由切換關卡，或學員想回看前幾關，提供簡潔關卡點選條 */}
                <div className="grid grid-cols-7 gap-1 bg-slate-900 p-1.5 rounded-2xl border border-slate-800">
                  {STAGES.map((st, idx) => {
                    const broadcastIdx = STAGES.findIndex((s) => s.id === broadcastStageId);
                    const canClick = !isTeacherSync || idx <= broadcastIdx;
                    const isCurr = effectiveStageId === st.id;
                    const isDone = activeSession?.responses?.[st.id]?.passed;
                    return (
                      <button
                        key={st.id}
                        type="button"
                        disabled={!canClick}
                        onClick={() => setSelectedStageId(st.id)}
                        className={`py-2 rounded-xl text-center transition cursor-pointer disabled:opacity-35 ${
                          isCurr
                            ? 'bg-amber-400 text-slate-950 font-black shadow-xs'
                            : isDone
                            ? 'bg-emerald-900/70 text-emerald-200 font-bold'
                            : 'text-slate-400 hover:text-white font-bold'
                        }`}
                      >
                        <div className="text-xs">{st.id}</div>
                        <div className="text-[10px] truncate px-0.5">{st.shortName}</div>
                      </button>
                    );
                  })}
                </div>

                {/* 2. 三顆極簡隨身小抄按鈕：放大看關係圖 / 展開讀情境故事 / 看造句模板 */}
                <div className="grid grid-cols-3 gap-2">
                  <button
                    type="button"
                    onClick={() => setDiagramFullscreenTrigger((c) => c + 1)}
                    className="p-3 rounded-2xl bg-indigo-900 hover:bg-indigo-800 text-white border border-indigo-500/40 flex flex-col items-center justify-center gap-1 text-center cursor-pointer shadow-xs"
                  >
                    <Maximize2 className="w-4 h-4 text-amber-400" />
                    <span className="text-xs font-extrabold">🔍 放大看關係圖</span>
                  </button>

                  <button
                    type="button"
                    onClick={() =>
                      setQrMobileDrawer((prev) => (prev === 'story' ? 'none' : 'story'))
                    }
                    className={`p-3 rounded-2xl border flex flex-col items-center justify-center gap-1 text-center cursor-pointer shadow-xs ${
                      qrMobileDrawer === 'story'
                        ? 'bg-amber-400 text-slate-950 border-amber-300 font-black'
                        : 'bg-slate-900 text-white border-slate-700 font-extrabold'
                    }`}
                  >
                    <BookOpen className="w-4 h-4 text-amber-400" />
                    <span className="text-xs">
                      {qrMobileDrawer === 'story' ? '▲ 收合情境故事' : '📖 讀情境與事實'}
                    </span>
                  </button>

                  <button
                    type="button"
                    onClick={() =>
                      setQrMobileDrawer((prev) => (prev === 'hint' ? 'none' : 'hint'))
                    }
                    className={`p-3 rounded-2xl border flex flex-col items-center justify-center gap-1 text-center cursor-pointer shadow-xs ${
                      qrMobileDrawer === 'hint'
                        ? 'bg-emerald-400 text-slate-950 border-emerald-300 font-black'
                        : 'bg-slate-900 text-white border-slate-700 font-extrabold'
                    }`}
                  >
                    <Lightbulb className="w-4 h-4 text-emerald-400" />
                    <span className="text-xs">
                      {qrMobileDrawer === 'hint' ? '▲ 收合提示模板' : '💡 看提示與模板'}
                    </span>
                  </button>
                </div>

                {/* 隱藏掛載 MermaidDiagramCard 以支援全螢幕關係圖彈窗 */}
                <div className="hidden">
                  <MermaidDiagramCard
                    scenario={activeScenario}
                    externalFullscreenTrigger={diagramFullscreenTrigger}
                  />
                </div>

                {/* 摺疊抽屜 A：情境故事與已知事實/未知 */}
                {qrMobileDrawer === 'story' && (
                  <div className="bg-white rounded-3xl p-5 border-2 border-amber-400 space-y-4 shadow-xl">
                    <div className="flex items-center justify-between border-b border-slate-100 pb-2">
                      <h3 className="font-black text-base text-slate-900">
                        📖 {activeScenario?.title}
                      </h3>
                      <button
                        type="button"
                        onClick={() => setQrMobileDrawer('none')}
                        className="text-xs font-bold text-slate-500 px-2 py-1 rounded bg-slate-100"
                      >
                        收合
                      </button>
                    </div>
                    <FormattedStoryBlock
                      story={activeScenario?.story}
                      fontSizeLevel="medium"
                      boldHighlight={true}
                    />
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2 text-xs">
                      <div className="bg-emerald-50 p-3 rounded-xl border border-emerald-200 space-y-1">
                        <div className="font-extrabold text-emerald-900">✅ 已知事實 (Facts)：</div>
                        <ul className="list-disc list-inside text-slate-700 space-y-1">
                          {(activeScenario?.facts || []).map((f, i) => (
                            <li key={i}>{f}</li>
                          ))}
                        </ul>
                      </div>
                      <div className="bg-amber-50 p-3 rounded-xl border border-amber-200 space-y-1">
                        <div className="font-extrabold text-amber-900">❓ 待查未知 (Unknowns)：</div>
                        <ul className="list-disc list-inside text-slate-700 space-y-1">
                          {(activeScenario?.unknowns || []).map((u, i) => (
                            <li key={i}>{u}</li>
                          ))}
                        </ul>
                      </div>
                    </div>
                  </div>
                )}

                {/* 摺疊抽屜 B：本關提示與萬用填空造句模板 */}
                {qrMobileDrawer === 'hint' && (
                  <div className="bg-white rounded-3xl p-5 border-2 border-emerald-400 space-y-3 shadow-xl">
                    <div className="flex items-center justify-between">
                      <span className="text-xs font-black text-emerald-800 bg-emerald-100 px-2.5 py-1 rounded-full">
                        💡 {stageInfo.id} 思考提示與造句模板
                      </span>
                      <button
                        type="button"
                        onClick={() => {
                          setActiveCodexStageId(effectiveStageId);
                          setIsKnowledgeCodexOpen(true);
                        }}
                        className="text-xs font-extrabold text-indigo-700 underline cursor-pointer"
                      >
                        📚 打開完整理論寶典
                      </button>
                    </div>
                    <p className="text-sm text-slate-700 font-medium">{stageInfo.hint}</p>
                    <div className="p-3.5 rounded-2xl bg-amber-50 border border-amber-200 space-y-2">
                      <div className="text-xs font-black text-amber-950">
                        ✍️ 萬用填空模板（點擊下方按鈕可直接帶入作答框）：
                      </div>
                      <p className="text-xs sm:text-sm text-slate-800 font-bold leading-relaxed">
                        {codexInfo.formulaTemplate}
                      </p>
                      <button
                        type="button"
                        onClick={() => {
                          setDraftResponse(codexInfo.formulaTemplate);
                          setCurrentAssistance('hint');
                          setQrMobileDrawer('none');
                          showToast('已帶入思考造句模板，請填入您的具體觀察！', 'success');
                        }}
                        className="w-full py-2 rounded-xl bg-indigo-600 text-white text-xs font-extrabold cursor-pointer"
                      >
                        ＋ 一鍵將模板帶入下方作答框
                      </button>
                    </div>
                  </div>
                )}

                {/* 3. 核心互動卡片：老師本關提問 ＋ 手機直接打字投遞到大螢幕 */}
                <div className="bg-white rounded-3xl p-5 sm:p-6 border-2 border-indigo-200 shadow-xl space-y-4">
                  <div className="bg-indigo-950 text-white rounded-2xl p-4 space-y-1.5">
                    <div className="text-xs font-black text-amber-400 flex items-center gap-1.5">
                      <Brain className="w-4 h-4" />
                      <span>本關核心提問（您的回答將同步至講台大螢幕）</span>
                    </div>
                    <p className="text-base sm:text-lg font-extrabold leading-snug">
                      {stageInfo.coachQuestion}
                    </p>
                    <p className="text-xs text-indigo-200 pt-1">
                      任務要求：{stageInfo.task}
                    </p>
                  </div>

                  <div className="space-y-2">
                    <div className="flex items-center justify-between">
                      <label className="text-sm font-extrabold text-slate-800">
                        ✍️ 請輸入您對【{stageInfo.name}】的觀點：
                      </label>
                      {mySubmittedResp && (
                        <span className="text-xs font-extrabold text-emerald-700 bg-emerald-50 px-2.5 py-0.5 rounded-full border border-emerald-300">
                          ✅ 已投遞至大螢幕 ({mySubmittedResp.submittedAt})
                        </span>
                      )}
                    </div>

                    <textarea
                      value={draftResponse}
                      onChange={(e) => setDraftResponse(e.target.value)}
                      rows={5}
                      placeholder={`請在此輸入您的想法（不知道怎麼寫可點上方「💡 看提示與模板」）...`}
                      className="w-full p-4 rounded-2xl border-2 border-slate-300 focus:border-indigo-600 focus:outline-none text-base leading-relaxed font-medium"
                    />
                  </div>

                  <button
                    type="button"
                    disabled={isSubmittingCloud}
                    onClick={handleSubmitStageResponse}
                    className="w-full py-4 rounded-2xl bg-indigo-600 hover:bg-indigo-500 disabled:opacity-60 text-white font-black text-base sm:text-lg shadow-lg flex items-center justify-center gap-2 cursor-pointer"
                  >
                    <Send className="w-5 h-5" />
                    <span>
                      {isSubmittingCloud
                        ? `⏳ 正在傳送 ${stageInfo.id} 回答至老師雲端大螢幕...`
                        : mySubmittedResp
                        ? `🔄 更新並重新投遞 ${stageInfo.id} 回答至大螢幕`
                        : `🚀 送出 ${stageInfo.id} 回答至老師大螢幕`}
                    </span>
                  </button>

                  {mySubmittedResp && (
                    <div className="p-3.5 rounded-2xl bg-emerald-50 border-2 border-emerald-300 text-emerald-950 text-xs sm:text-sm font-bold flex items-center gap-2">
                      <CheckCircle2 className="w-5 h-5 text-emerald-600 shrink-0" />
                      <span>
                        ☁️ 雲端已送達老師大螢幕（課堂代碼：{activeClassroom?.joinCode}｜關卡：{stageInfo.id}｜時間：{lastCloudDeliveredAt || mySubmittedResp.submittedAt}）！請抬頭觀看大螢幕討論。
                      </span>
                    </div>
                  )}
                </div>
              </main>
            )}

            <footer className="bg-slate-900 border-t border-slate-800 py-3 px-4 text-center text-[11px] text-slate-400">
              © 2020 TonyStudio. TONY Thinking Lab 課堂即時互動系統
            </footer>
          </div>
        );
      }

      if (!currentUser) {
        return (
          <div style={zoomStyle} className="min-h-screen bg-slate-950 text-slate-900 flex flex-col justify-between">
            {renderUserGuideModal()}
            {renderKnowledgeCodexModal()}

            <header className="bg-slate-900/90 border-b border-slate-800 px-4 sm:px-8 py-3.5 flex flex-wrap items-center justify-between gap-3 text-white">
              <div className="flex items-center gap-3">
                <img
                  src={BRAND_LOGO_URL}
                  alt="TONY Thinking Lab Logo"
                  className="w-10 h-10 rounded-xl object-contain bg-white p-1"
                />
                <div>
                  <span className="font-black text-lg tracking-tight">TONY Thinking Lab</span>
                  <span className="hidden sm:inline-block ml-2 text-xs text-amber-400 font-bold">
                    AI 思考能力互動實驗室｜Make Thinking Visible
                  </span>
                </div>
              </div>

              <div className="flex flex-wrap items-center gap-2">
                <button
                  type="button"
                  onClick={() => {
                    setActiveCodexStageId('G0');
                    setIsKnowledgeCodexOpen(true);
                  }}

                      <div className="relative">
                        <input
                          type={showPassword ? 'text' : 'password'}
                          value={authPassword}
                          onChange={(e) => setAuthPassword(e.target.value)}
                          placeholder="請輸入密碼"
                          className="w-full px-4 py-3 rounded-xl border-2 border-slate-300 text-sm font-bold pr-11"
                        />

                          type="button"
                          onClick={() => setShowPassword((v) => !v)}

                        >
                          {showPassword ? <EyeOff className="w-5 h-5" /> : <Eye className="w-5 h-5" />}
                        </button>
                      </div>
                    </div>
                    <button
                      type="submit"
                      disabled={isAuthLoading}
                      className="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold text-base cursor-pointer"

                      </label>

                          <button
                            key={idType}
                            type="button"
                            onClick={() => setAuthIdentity(idType)}
                            className={`py-2.5 px-3 rounded-xl text-xs font-extrabold border-2 cursor-pointer ${
                              authIdentity === idType
                                ? 'bg-indigo-50 border-indigo-600 text-indigo-950'
                                : 'border-slate-200 text-slate-600'
                            }`}
                          >
                            {idType}
                          </button>

                          className="w-full px-4 py-2.5 rounded-xl border-2 border-slate-300 text-sm font-bold pr-11"

                          type="button"
                          onClick={() => setShowPassword((v) => !v)}

                        </button>
                      </div>
                    </div>
                    <button
                      type="submit"
                      disabled={isAuthLoading}
                      className="w-full py-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold text-base cursor-pointer"
                    >
                      註冊並發送驗證信 (Double Opt-in)
                    </button>
                  </form>
                )}

                {authMode === 'reset' && (
                  <form onSubmit={handlePasswordReset} className="space-y-4">
                    <div>
                      <label className="block text-sm font-extrabold text-slate-700 mb-1">
                        輸入您的註冊信箱以寄送密碼重設連結
                      </label>
                      <input
                        type="email"
                        value={authEmail}
                        onChange={(e) => setAuthEmail(e.target.value)}
                        placeholder="name@example.com"
                        className="w-full px-4 py-3 rounded-xl border-2 border-slate-300 text-sm font-bold"
                      />

                        type="button"

                  </div>
                </div>
              </div>
            </main>

            <footer className="bg-slate-900 border-t border-slate-800 py-4 px-6 text-center text-xs text-slate-400">

            </footer>

        );

        { id: 'learn', num: 2, title: '第 2 步：G0–G6 思考闖關' },

        { id: 'teacher', num: 3, title: 'Step 3：建課堂 / QR碼 / 大螢幕牆' },

              <div
                onClick={() => setActiveView('home')}
                className="flex items-center gap-3 cursor-pointer"

                    setActiveView('teacher');

                    role === 'teacher'
                      ? 'bg-amber-400 text-slate-950 shadow-xs'
                      : 'text-slate-400 hover:text-white'

                  type="button"
                  onClick={() => {
                    setActiveCodexStageId(selectedStageId || 'G0');
                    setIsKnowledgeCodexOpen(true);
                  }}
                  className="px-3 py-1.5 rounded-xl bg-emerald-400 hover:bg-emerald-300 text-slate-950 text-xs font-extrabold flex items-center gap-1 cursor-pointer shadow-2xs"
                >
                  <Brain className="w-3.5 h-3.5" /> 📚 思維知識寶典
                </button>

                <button
                  type="button"
                  onClick={() => {
                    setUserGuideTab(role === 'teacher' ? 'teacher' : 'student');

                    type="button"

                  </button>

                  {[
                    { id: 'normal', label: '標準' },
                    { id: 'large', label: '大字' },
                    { id: 'xlarge', label: '特大' }
                  ].map((z) => (
                    <button
                      key={z.id}
                      type="button"
                      onClick={() => setFontScale(z.id)}
                      className={`px-2 py-1 rounded-lg font-bold cursor-pointer ${

                    >

                    const isActive = activeView === st.id;
                    return (
                      <React.Fragment key={st.id}>
                        <button
                          type="button"
                          onClick={() => setActiveView(st.id)}
                          className={`px-3.5 py-1.5 rounded-xl text-xs sm:text-sm font-extrabold transition flex items-center gap-2 cursor-pointer ${
                            isActive
                              ? 'bg-indigo-600 text-white shadow-xs ring-2 ring-amber-400'
                              : 'bg-slate-800 text-slate-300 hover:bg-slate-700'

                        >
                          <span className="w-5 h-5 rounded-full bg-white/20 text-xs flex items-center justify-center font-black">

                          <span>{st.title}</span>

                        {i < activeSteps.length - 1 && (
                          <ChevronRight className="w-4 h-4 text-slate-600 hidden sm:block" />

            {activeView === 'learn' && renderLearnView()}
            {activeView === 'report' && renderReportView()}
            {activeView === 'teacher' && renderTeacherDashboard()}
            {activeView === 'scenarios' && renderScenariosView()}
            {activeView === 'api' && renderByokSettingsView()}
            {activeView === 'admin' && renderAdminDashboardView()}

                  onClick={() => setIsUserGuideOpen(true)}
                  className="text-amber-400 hover:underline font-bold cursor-pointer"
                >
                  📖 開啟學員與教師使用說明手冊
                </button>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    // 全域錯誤邊界保護罩（確保單一 HTML 在任何瀏覽器環境下絕不發生白畫面）
    class GlobalErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, errorMsg: '' };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, errorMsg: error?.message || String(error) };
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen bg-slate-950 text-white flex items-center justify-center p-6">
              <div className="bg-slate-900 border-2 border-amber-400 rounded-3xl max-w-lg w-full p-8 space-y-4 text-center">
                <div className="text-xl font-black text-amber-400">
                  系統畫面自動保護啟動
                </div>
                <p className="text-sm text-slate-300 leading-relaxed">
                  偵測到瀏覽器暫時性渲染異常：{this.state.errorMsg}
                </p>
                <button
                  type="button"
                  onClick={() => window.location.reload()}
                  className="px-5 py-2.5 rounded-xl bg-amber-400 text-slate-950 font-extrabold text-sm cursor-pointer"
                >
                  點擊立即重新整理恢復
                </button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    // 啟動掛載單一 HTML 應用程式
    const rootElement = document.getElementById('root');
    if (rootElement) {
      createRoot(rootElement).render(
        <GlobalErrorBoundary>
          <App />
        </GlobalErrorBoundary>
      );
    }
  </script>
</body>
</html>
